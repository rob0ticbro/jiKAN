<!doctype html>
<html lang="en" data-theme="obsidian">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>HOUR — 時間 (Jikan)</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #f3f2ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #777773;
      --line: #222220;
      --panel: #111110;
      --page: #000;
      --foreground: #f3f2ef;
      --subtle: #777773;
      --edge: #252523;
      --input-bg: #0c0c0b;
      --input-fg: #e9e8e3;
      --segment-bg: #080808;
      --segment-edge: #1d1d1b;
      --segment-active: #20201e;
      --segment-active-edge: #30302d;
      --digit-bg: linear-gradient(110deg, #171716, #10100f 54%, #171716);
      --face-bg: linear-gradient(105deg, #1a1a19, #121211 55%, #191918);
      --digit-ink: #efeee9;
      --seam: #050505;
      --tile-shadow: inset 1px 0 1px #ffffff08, inset -1px 0 1px #000, 0 2px 3px #000, 0 12px 26px #0009;
      --theme-accent: #dedbd2;
      --ambient-bg: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--page);
      background-image: var(--ambient-bg);
      color: var(--foreground);
      transition: background-color 700ms ease, color 700ms ease;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app-shell {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      padding: 34px clamp(20px, 5vw, 72px) 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
    }

    .theme-switcher {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      color: var(--foreground);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .16em;
    }

    .brand small {
      color: var(--subtle);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .08em;
    }

    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .topbar-actions .control-button { min-width: 0; }

    .theme-arrow {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--edge);
      border-radius: 50%;
      background: var(--panel);
      color: var(--subtle);
      cursor: pointer;
      transition: color 180ms ease, background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .theme-arrow:hover { transform: scale(1.06); color: var(--foreground); border-color: var(--theme-accent); }
    .theme-arrow:active { transform: scale(.96); }
    .theme-arrow svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }

    .theme-current { min-width: 138px; text-align: center; }
    .theme-name {
      display: block;
      color: var(--foreground);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .02em;
      transition: color 350ms ease, opacity 240ms ease, transform 240ms ease;
    }

    .theme-count {
      display: block;
      margin-top: 3px;
      color: var(--subtle);
      font-size: 9px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    @supports (view-transition-name: root) {
      ::view-transition-old(root) {
        animation: none;
        z-index: 1;
      }

      ::view-transition-new(root) {
        position: relative;
        z-index: 2;
        will-change: clip-path;
        clip-path: inset(0 100% 0 0);
        animation: theme-reveal-forward 720ms cubic-bezier(.4, 0, .75, .85) both;
      }

      :root[data-wipe-direction="reverse"]::view-transition-new(root) {
        clip-path: inset(0 0 0 100%);
        animation-name: theme-reveal-reverse;
      }

      ::view-transition-group(wipe-edge) {
        z-index: 3;
        animation-duration: 720ms;
      }

      ::view-transition-new(wipe-edge) {
        will-change: transform;
        animation: theme-reveal-edge-forward 720ms cubic-bezier(.4, 0, .75, .85) both;
      }

      :root[data-wipe-direction="reverse"]::view-transition-new(wipe-edge) {
        animation-name: theme-reveal-edge-reverse;
      }

      @keyframes theme-reveal-forward {
        from { clip-path: inset(0 100% 0 0); }
        to { clip-path: inset(0 0 0 0); }
      }

      @keyframes theme-reveal-edge-forward {
        from { transform: translate3d(-2px, 0, 0); }
        to { transform: translate3d(100vw, 0, 0); }
      }

      @keyframes theme-reveal-reverse {
        from { clip-path: inset(0 0 0 100%); }
        to { clip-path: inset(0 0 0 0); }
      }

      @keyframes theme-reveal-edge-reverse {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(-100vw, 0, 0); }
      }

      :root[data-wipe-direction="reverse"] .theme-wipe-edge { left: auto; right: -2px; }
    }

    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px 0;
    }

    .mode-tabs {
      position: relative;
      display: grid;
      width: min(402px, calc(100vw - 32px));
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding: 4px;
      border: 1px solid var(--segment-edge);
      border-radius: 9px;
      background: var(--segment-bg);
      isolation: isolate;
      overflow: hidden;
    }

    .mode-indicator {
      position: absolute;
      z-index: -1;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc((100% - 8px) / 3);
      border: 1px solid var(--segment-active-edge);
      border-radius: 7px;
      background: var(--segment-active);
      box-shadow: inset 0 1px #ffffff12, 0 2px 8px #0002;
      transform: translateX(0);
      transform: translateX(0);
      transition: transform 620ms cubic-bezier(.22, 1, .36, 1), background-color 240ms ease, border-color 240ms ease;
      pointer-events: none;
    }

    .mode-tab {
      position: relative;
      z-index: 1;
      min-width: 0;
      padding: 13px 15px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--subtle);
      cursor: pointer;
      font-size: 15px;
      transition: color 280ms ease;
    }

    .mode-tab:hover { color: var(--foreground); }
    .mode-tab[aria-pressed="true"] { color: var(--foreground); }

    .clock-stage {
      display: flex;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: clamp(45px, 9vh, 90px) 0 clamp(38px, 7vh, 72px);
    }

    .mode-caption {
      min-height: 19px;
      margin-bottom: 28px;
      color: var(--subtle);
      font-size: 11px;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .clock-display {
      position: relative;
      display: flex;
      align-items: center;
      gap: clamp(20px, 4vw, 60px);
      filter: drop-shadow(0 20px 34px #000);
      font-variant-numeric: tabular-nums;
      transition: filter 700ms ease;
    }

    .meridiem {
      position: absolute;
      right: clamp(-48px, -4vw, -24px);
      bottom: 8%;
      color: var(--subtle);
      font-size: clamp(.65rem, 1.8vw, 1rem);
      letter-spacing: .12em;
      opacity: 0;
      visibility: hidden;
      transition: opacity 180ms ease, visibility 180ms ease;
      pointer-events: none;
    }

    .clock-display.has-meridiem:hover .meridiem,
    .clock-display.has-meridiem:focus-within .meridiem { opacity: 1; visibility: visible; }

    .digit-group {
      display: flex;
      gap: clamp(5px, .75vw, 10px);
    }

    .digit {
      position: relative;
      width: .72em;
      height: 1.16em;
      overflow: hidden;
      border: 1px solid var(--edge);
      border-radius: .085em;
      background: var(--digit-bg);
      box-shadow: var(--tile-shadow);
      color: var(--digit-ink);
      transition: background 700ms ease, border-color 700ms ease, color 700ms ease, box-shadow 700ms ease;
      font-family: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif;
      font-size: clamp(5.2rem, 18vw, 14rem);
      font-weight: 300;
      line-height: 1;
      perspective: 700px;
      text-align: center;
    }

    .digit::after {
      position: absolute;
      z-index: 5;
      top: 50%;
      right: 0;
      left: 0;
      height: 1px;
      background: var(--seam);
      box-shadow: 0 1px #ffffff0b;
      content: "";
    }

    .half, .flap {
      position: absolute;
      right: 0;
      left: 0;
      display: flex;
      height: 50%;
      overflow: hidden;
      align-items: center;
      justify-content: center;
      background: var(--face-bg);
      backface-visibility: hidden;
      transition: background 700ms ease;
    }

    .half span, .flap span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 200%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.16em;
    }

    .upper { top: 0; border-radius: .08em .08em 0 0; }
    .upper span, .flap-top span { top: 0; }
    .lower { bottom: 0; border-radius: 0 0 .08em .08em; }
    .lower span, .flap-bottom span { bottom: 0; }

    .flap {
      z-index: 3;
      visibility: hidden;
    }

    .flap-top {
      top: 0;
      z-index: 4;
      transform-origin: bottom;
    }

    .flap-bottom {
      bottom: 0;
      z-index: 2;
      transform: rotateX(90deg);
      transform-origin: top;
    }

    .digit.flipping .flap { visibility: visible; }
    .digit.flipping .flap-top { animation: flip-away .28s cubic-bezier(.45, 0, .8, .25) forwards; }
    .digit.flipping .flap-bottom { animation: flip-in .3s .25s cubic-bezier(.15, .7, .25, 1) forwards; }

    @keyframes flip-away {
      from { transform: rotateX(0); }
      to { transform: rotateX(-90deg); }
    }

    @keyframes flip-in {
      from { transform: rotateX(90deg); }
      to { transform: rotateX(0); }
    }

    .separator {
      align-self: center;
      margin: 0 .01em;
      color: var(--subtle);
      font-size: clamp(3rem, 9vw, 7rem);
      font-weight: 200;
      line-height: 1;
      transform: translateY(-.04em);
    }

    .control-panel {
      display: flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .duration-settings {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 7px;
    }

    .duration-field {
      display: flex;
      align-items: baseline;
      gap: 5px;
      color: var(--subtle);
      font-size: 11px;
    }

    .duration-field input {
      width: 48px;
      padding: 8px 7px;
      border: 1px solid var(--edge);
      border-radius: 6px;
      outline: none;
      background: var(--input-bg);
      color: var(--input-fg);
      text-align: center;
    }

    .duration-field input:focus { border-color: var(--subtle); }
    .duration-field input:disabled { opacity: .48; }

    .control-button {
      min-width: 84px;
      padding: 9px 15px;
      border: 1px solid var(--edge);
      border-radius: 6px;
      background: var(--panel);
      color: var(--foreground);
      cursor: pointer;
      font-size: 12px;
      transition: background .18s ease, border-color .18s ease;
    }

    .control-button:hover {
      border-color: var(--subtle);
      background: var(--segment-active);
    }

    .control-button.primary {
      border-color: #eceae3;
      background: #eceae3;
      color: #10100f;
      font-weight: 600;
    }

    .control-button.primary:hover { background: #fff; }
    .control-button.icon-button { display: grid; min-width: 38px; width: 38px; height: 38px; place-items: center; padding: 0; }
    .icon-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.5; }

    .fullscreen-mode, .fullscreen-mode body { width: 100%; height: 100%; min-height: 100%; overflow: hidden; cursor: none; }
    .fullscreen-mode .topbar,
    .fullscreen-mode .mode-tabs,
    .fullscreen-mode .mode-caption,
    .fullscreen-mode .control-panel { display: none; }
    .fullscreen-mode .meridiem { opacity: 0 !important; visibility: hidden !important; }


    @media (max-width: 620px) {
      .app-shell { padding: 22px 16px; }
      .theme-switcher { gap: 7px; }
      .theme-current { min-width: 112px; }
      .theme-arrow { width: 30px; height: 30px; }
      .brand { display: none; }
      .topbar-actions { gap: 6px; }
      .topbar-actions .control-button { padding: 8px 10px; font-size: 11px; }
      .mode-tab { min-width: 72px; padding: 9px 10px; }
      .clock-stage { margin: 54px 0 42px; }
      .digit { font-size: clamp(3rem, 17vw, 7rem); }
      .clock-display { gap: clamp(12px, 4vw, 25px); }
      .digit-group { gap: 3px; }
      .separator { font-size: clamp(2.4rem, 9vw, 4rem); }
      .control-panel { max-width: 100%; flex-wrap: wrap; }
      .duration-settings { margin-right: 0; }
      .control-button { min-width: 72px; }
      .theme-form { grid-template-columns: 1fr; }
      .theme-form .name-field, .theme-form .glow-field { grid-column: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      .digit.flipping .flap-top { animation-duration: .14s; }
      .digit.flipping .flap-bottom { animation-duration: .14s; animation-delay: .12s; }
      .mode-indicator, .mode-tab { transition-duration: .01ms; }
      body, .digit, .half, .flap, .theme-name { transition-duration: .01ms; }
      ::view-transition-new(root),
      ::view-transition-new(wipe-edge) { animation-duration: .01ms !important; }
    }

    html[data-theme="light"] {
      color-scheme: light;
      --page: #e9eef5;
      --foreground: #202b3b;
      --subtle: #738096;
      --edge: #c9d2df;
      --input-bg: #f8faff;
      --input-fg: #202b3b;

      --segment-edge: #d3dce8;
      --segment-active: #fff;

      --digit-bg: linear-gradient(135deg, #f8fbff, #dce5ef 56%, #f5f8fc);
      --face-bg: linear-gradient(105deg, #f8fbff, #e6ecf4 55%, #f6f9fd);
      --digit-ink: #1d2735;

    html[data-theme="light"] .control-button.primary:hover { background: #384b63; }
    html[data-theme="light"] .digit::after { box-shadow: 0 1px #fff9; }

    html[data-theme="solarized-dark"] {
      --page: #002b36;

      --edge: #28525b;
      --input-bg: #00212a;

    html[data-theme="catppuccin-latte"] .control-button.primary,

    .theme-arrow:disabled { opacity: .48; cursor: default; transform: none; }

    .theme-editor {
      width: min(660px, calc(100vw - 32px));

    .theme-editor::backdrop { background: #000a; }

    .editor-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }

    .theme-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

    .theme-form input[type="range"] { width: 120px; accent-color: var(--theme-accent); }

    .status-message {

    .screensaver {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      overflow: hidden;
      background: var(--page);
      background-image: var(--ambient-bg);

    html[data-theme^="custom-"] .digit {

    html[data-theme="dracula"] .control-button.primary,
    html[data-theme="tokyo-night"] .control-button.primary,
    html[data-theme="nord"] .control-button.primary,

    html[data-theme="catppuccin-mocha"] .control-button.primary,

</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="HOUR, Jikan">
        <span>HOUR</span><small>時間 · Jikan</small>
      </div>
      <div class="topbar-actions">
        <div class="theme-switcher" role="group" aria-label="Color theme">
          <button class="theme-arrow" type="button" data-theme-step="-1" aria-label="Previous theme">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 4-6 6 6 6"/></svg>
          </button>
          <div class="theme-current" aria-live="polite">
            <span class="theme-name" id="theme-name">Obsidian</span>
            <span class="theme-count" id="theme-count">01 / 14</span>
          </div>
          <button class="theme-arrow" type="button" data-theme-step="1" aria-label="Next theme">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 4 6 6-6 6"/></svg>
          </button>
        </div>
        <button class="control-button" type="button" data-action="screensaver">Screensaver</button>

    </header>

    <section class="workspace" aria-label="Flip clock">
      <nav class="mode-tabs" aria-label="Clock mode">
        <span class="mode-indicator" aria-hidden="true"></span>
        <button class="mode-tab" type="button" data-mode="clock" aria-pressed="true">Clock</button>
        <button class="mode-tab" type="button" data-mode="timer" aria-pressed="false">Timer</button>
        <button class="mode-tab" type="button" data-mode="pomodoro" aria-pressed="false">Pomodoro</button>
      </nav>

      <div class="clock-stage">
        <div class="mode-caption" id="mode-caption">Local time</div>
        <div class="clock-display" id="clock-display" role="timer" aria-label="Current time">
          <span class="meridiem" id="meridiem" aria-hidden="true"></span>
        </div>
      </div>

      <div class="control-panel" id="control-panel"></div>
    </section>

  </main>
  <div class="theme-wipe-edge" aria-hidden="true"></div>
  <div class="screensaver" id="screensaver" aria-label="Bouncing screensaver"></div>
  <dialog class="theme-editor" id="theme-editor" aria-labelledby="editor-title">
    <div class="editor-content">
      <div class="editor-heading">
        <div>
          <h2 id="editor-title">Personalize HOUR</h2>
          <p>Built-in themes stay unchanged. Your themes are saved on this device.</p>
        </div>
        <button class="control-button editor-close" type="button" data-action="close-editor" aria-label="Close theme editor">×</button>
      </div>
      <section class="editor-section" aria-label="Custom theme editor">
        <h3>Your themes</h3>
        <div class="theme-form">
          <label class="name-field" for="managed-theme">Edit theme
            <select id="managed-theme"><option value="">Create a new theme</option></select>
          </label>
          <label class="name-field" for="theme-name-input">Theme name
            <input id="theme-name-input" type="text" maxlength="32" required placeholder="My theme">
          </label>
          <label for="theme-page">Background<input id="theme-page" type="color" data-color-prop="page"></label>
          <label for="theme-foreground">Text<input id="theme-foreground" type="color" data-color-prop="foreground"></label>
          <label for="theme-subtle">Secondary text<input id="theme-subtle" type="color" data-color-prop="subtle"></label>
          <label for="theme-edge">Borders<input id="theme-edge" type="color" data-color-prop="edge"></label>
          <label for="theme-accent">Accent<input id="theme-accent" type="color" data-color-prop="accent"></label>
          <label for="theme-panel">Controls<input id="theme-panel" type="color" data-color-prop="panel"></label>
          <label for="theme-card">Card highlight<input id="theme-card" type="color" data-color-prop="card"></label>
          <label for="theme-card-alt">Card shade<input id="theme-card-alt" type="color" data-color-prop="cardAlt"></label>
          <label for="theme-face">Flip highlight<input id="theme-face" type="color" data-color-prop="face"></label>
          <label for="theme-face-alt">Flip shade<input id="theme-face-alt" type="color" data-color-prop="faceAlt"></label>
          <label for="theme-digit">Digit color<input id="theme-digit" type="color" data-color-prop="digit"></label>
          <label for="theme-seam">Flip seam<input id="theme-seam" type="color" data-color-prop="seam"></label>

            <select id="hour-format">
              <option value="24">24-hour</option>

            <select id="screensaver-delay">
              <option value="0">Off</option>

              <option value="600000">10 minutes</option>

        </div>

  <div class="status-message" id="status-message" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const display = document.getElementById("clock-display");
      const caption = document.getElementById("mode-caption");
      const panel = document.getElementById("control-panel");
      const themeSwitcher = document.querySelector(".theme-switcher");
      const themeName = document.getElementById("theme-name");
      const themeCount = document.getElementById("theme-count");
      const themeWipeEdge = document.querySelector(".theme-wipe-edge");
      const modeIndicator = document.querySelector(".mode-indicator");
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const modeButtons = [...document.querySelectorAll(".mode-tab")];
      const screensaver = document.getElementById("screensaver");
      const themeEditor = document.getElementById("theme-editor");
      const managedTheme = document.getElementById("managed-theme");
      const editorName = document.getElementById("theme-name-input");
      const editorError = document.getElementById("editor-error");
      const screensaverDelay = document.getElementById("screensaver-delay");
      const hourFormatControl = document.getElementById("hour-format");
      const meridiem = document.getElementById("meridiem");
      const statusMessage = document.getElementById("status-message");
      let statusTimer = 0;

      function announce(message) {
        statusMessage.textContent = message;
        statusMessage.classList.add("visible");
        window.clearTimeout(statusTimer);
        statusTimer = window.setTimeout(() => statusMessage.classList.remove("visible"), 3200);
      }

      function validHex(value) {
        return typeof value === "string" && /^#[\da-f]{6}$/i.test(value);
      }

      function validCustomTheme(theme) {
        return theme && typeof theme === "object" &&
          /^custom-[\da-z-]{1,48}$/.test(theme.id) &&
          typeof theme.name === "string" && theme.name.trim().length > 0 && theme.name.length <= 32 &&
          ["page", "foreground", "subtle", "edge", "panel", "card", "cardAlt", "face", "faceAlt", "digit", "seam", "accent"].every(key => validHex(theme[key])) &&
          Number.isInteger(theme.glow) && theme.glow >= 0 && theme.glow <= 40 && typeof theme.ambient === "boolean";
      }

      function loadCustomThemes() {
        try {
          const raw = localStorage.getItem("hour.custom-themes");
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) throw new TypeError("Saved themes must be a list.");
          const themes = parsed.filter(validCustomTheme);
          if (themes.length !== parsed.length) announce("Some saved themes were invalid and were skipped.");
          return themes;
        } catch (error) {
          if (error instanceof SyntaxError || error instanceof TypeError) {
            announce("Saved themes could not be read. You can create new themes in the editor.");
            return [];
          }
          announce("Browser storage is unavailable; custom themes may not persist.");
          return [];
        }
      }

      function loadSettings() {
        const defaults = {
          themeId: "obsidian",
          saverDelay: 0,
          hourFormat: "24",
          timerConfig: { hours: 0, minutes: 25, seconds: 0 },
          pomConfig: { work: 25, short: 5, long: 15 }
        };
        try {
          const raw = localStorage.getItem("hour.settings");
          if (!raw) return defaults;
          const stored = JSON.parse(raw);
          if (!stored || typeof stored !== "object") throw new TypeError("Saved settings are invalid.");
          const parseConfig = (candidate, keys, max, minimum) => {
            const result = {};
            for (const key of keys) {
              const value = Number(candidate?.[key]);
              result[key] = Number.isInteger(value) ? Math.min(max[key], Math.max(minimum[key], value)) : defaults[key === "hours" || key === "minutes" || key === "seconds" ? "timerConfig" : "pomConfig"][key];
            }
            return result;
          };
          return {
            themeId: typeof stored.themeId === "string" ? stored.themeId : defaults.themeId,
            saverDelay: [0, 60000, 120000, 300000, 600000, 900000].includes(stored.saverDelay) ? stored.saverDelay : 0,
            hourFormat: stored.hourFormat === "12" ? "12" : "24",
            timerConfig: parseConfig(stored.timerConfig, ["hours", "minutes", "seconds"], { hours: 99, minutes: 59, seconds: 59 }, { hours: 0, minutes: 0, seconds: 0 }),
            pomConfig: parseConfig(stored.pomConfig, ["work", "short", "long"], { work: 180, short: 60, long: 90 }, { work: 1, short: 1, long: 1 })
          };
        } catch {
          announce("Saved settings could not be read; default settings are in use.");
          return defaults;
        }
      }

      const storedThemes = loadCustomThemes();
      const savedSettings = loadSettings();
      const themes = [
        { id: "obsidian", name: "Obsidian", color: "#000000", accent: "#dedbd2", scheme: "dark" },
        { id: "light", name: "Light", color: "#e9eef5", accent: "#556b88", scheme: "light" },
        { id: "catppuccin-mocha", name: "Catppuccin Mocha", color: "#1e1e2e", accent: "#cba6f7", scheme: "dark" },
        { id: "catppuccin-latte", name: "Catppuccin Latte", color: "#eff1f5", accent: "#8839ef", scheme: "light" },
        { id: "gruvbox", name: "Gruvbox", color: "#282828", accent: "#fabd2f", scheme: "dark" },
        { id: "nord", name: "Nord", color: "#2e3440", accent: "#88c0d0", scheme: "dark" },
        { id: "dracula", name: "Dracula", color: "#282a36", accent: "#bd93f9", scheme: "dark" },
        { id: "tokyo-night", name: "Tokyo Night", color: "#1a1b26", accent: "#7aa2f7", scheme: "dark" },
        { id: "solarized-dark", name: "Solarized Dark", color: "#002b36", accent: "#2aa198", scheme: "dark" },
        { id: "solarized-light", name: "Solarized Light", color: "#fdf6e3", accent: "#268bd2", scheme: "light" },
        { id: "monokai", name: "Monokai", color: "#2d2a2e", accent: "#ff6188", scheme: "dark" },
        { id: "rose-pine", name: "Rosé Pine", color: "#191724", accent: "#ebbcba", scheme: "dark" },
        { id: "everforest", name: "Everforest", color: "#2d353b", accent: "#a7c080", scheme: "dark" },
        { id: "amber-terminal", name: "Amber Terminal", color: "#17130b", accent: "#ffbb33", scheme: "dark" }
      ];
      themes.push(...storedThemes.map(toCarouselTheme));
      const state = {
        mode: "clock",
        timerConfig: savedSettings.timerConfig,
        pomConfig: savedSettings.pomConfig,
        timerRemaining: savedSettings.timerConfig.hours * 3600 + savedSettings.timerConfig.minutes * 60 + savedSettings.timerConfig.seconds,
        timerDeadline: null,
        pomRemaining: savedSettings.pomConfig.work * 60,
        pomDeadline: null,
        pomPhase: "Work",
        workSessions: 0,
        fullscreen: false,
        themeIndex: Math.max(0, themes.findIndex(theme => theme.id === savedSettings.themeId)),
        themeSwitching: false,
        screensaver: false,
        saverDelay: savedSettings.saverDelay,
        hourFormat: savedSettings.hourFormat
      };

      const safeInt = (input, fallback = 0) => {
        const value = Number.parseInt(input.value, 10);
        return Number.isFinite(value) ? Math.max(0, value) : fallback;
      };

      const colorProperties = ["page", "foreground", "subtle", "edge", "panel", "card", "cardAlt", "face", "faceAlt", "digit", "seam", "accent"];
      const cssProperties = ["--page", "--foreground", "--subtle", "--edge", "--panel", "--digit-bg", "--face-bg", "--digit-ink", "--seam", "--theme-accent", "--custom-glow", "--ambient-bg"];

      function toCarouselTheme(theme) {
        const red = Number.parseInt(theme.page.slice(1, 3), 16);
        const green = Number.parseInt(theme.page.slice(3, 5), 16);
        const blue = Number.parseInt(theme.page.slice(5, 7), 16);
        return { ...theme, color: theme.page, scheme: red * 0.299 + green * 0.587 + blue * 0.114 > 150 ? "light" : "dark", custom: true };
      }

      function persistSettings() {
        try {
          localStorage.setItem("hour.settings", JSON.stringify({
            themeId: themes[state.themeIndex]?.id || "obsidian",
            saverDelay: state.saverDelay,
            hourFormat: state.hourFormat,
            timerConfig: state.timerConfig,
            pomConfig: state.pomConfig
          }));
        } catch {
          announce("Browser storage is unavailable; your settings could not be saved.");
        }
      }

      function persistCustomThemes() {
        try {
          const custom = themes.filter(theme => theme.custom).map(theme => {
            const saved = { id: theme.id, name: theme.name, glow: theme.glow, ambient: theme.ambient };
            for (const key of colorProperties) saved[key] = theme[key];
            return saved;
          });
          localStorage.setItem("hour.custom-themes", JSON.stringify(custom));
          return true;
        } catch {
          announce("Browser storage is unavailable; your custom theme could not be saved.");
          return false;
        }
      }

      function setCustomThemeStyle(theme) {
        const root = document.documentElement;
        for (const property of cssProperties) root.style.removeProperty(property);
        if (!theme.custom) return;
        const red = Number.parseInt(theme.accent.slice(1, 3), 16);
        const green = Number.parseInt(theme.accent.slice(3, 5), 16);
        const blue = Number.parseInt(theme.accent.slice(5, 7), 16);
        const properties = {
          "--page": theme.page,
          "--foreground": theme.foreground,
          "--subtle": theme.subtle,
          "--edge": theme.edge,
          "--panel": theme.panel,
          "--digit-bg": `linear-gradient(110deg, ${theme.card}, ${theme.cardAlt} 54%, ${theme.card})`,
          "--face-bg": `linear-gradient(105deg, ${theme.face}, ${theme.faceAlt} 55%, ${theme.face})`,
          "--digit-ink": theme.digit,
          "--seam": theme.seam,
          "--theme-accent": theme.accent,
          "--custom-glow": `${theme.glow}px`,
          "--ambient-bg": theme.ambient
            ? `radial-gradient(ellipse at 12% 80%, rgba(${red}, ${green}, ${blue}, .09), transparent 42%), radial-gradient(ellipse at 88% 18%, rgba(${red}, ${green}, ${blue}, .06), transparent 38%)`
            : "none"
        };
        for (const [property, value] of Object.entries(properties)) root.style.setProperty(property, value);
      }

      function updateThemeMeta() {
        const theme = themes[state.themeIndex];
        themeName.textContent = theme.name;
        themeCount.textContent = `${String(state.themeIndex + 1).padStart(2, "0")} / ${String(themes.length).padStart(2, "0")}`;
      }

      function firstColor(value, fallback) {
        const color = String(value).match(/#[\da-f]{6}/i)?.[0];
        return color || fallback;
      }

      function secondColor(value, fallback) {
        const colors = String(value).match(/#[\da-f]{6}/ig);
        return colors?.[1] || colors?.[0] || fallback;
      }

      function currentPalette() {
        const style = getComputedStyle(document.documentElement);
        const defaults = {
          page: "#202020", foreground: "#eeeeee", subtle: "#999999", edge: "#444444",
          panel: "#303030", card: "#282828", cardAlt: "#181818", face: "#333333",
          faceAlt: "#222222", digit: "#eeeeee", seam: "#101010", accent: "#b9a6ff"
        };
        const variables = {
          page: "--page", foreground: "--foreground", subtle: "--subtle", edge: "--edge", panel: "--panel",
          card: "--digit-bg", face: "--face-bg", digit: "--digit-ink", seam: "--seam", accent: "--theme-accent"
        };
        const palette = Object.fromEntries(Object.entries(variables).map(([key, property]) =>
          [key, firstColor(style.getPropertyValue(property), defaults[key])]));
        palette.cardAlt = secondColor(style.getPropertyValue("--digit-bg"), defaults.cardAlt);
        palette.faceAlt = secondColor(style.getPropertyValue("--face-bg"), defaults.faceAlt);
        palette.ambient = style.getPropertyValue("--ambient-bg").trim() !== "none";
        return palette;
      }

      function fillThemeEditor(theme, name = "My Theme") {
        editorName.value = theme?.name || name;
        const palette = theme || currentPalette();
        for (const input of document.querySelectorAll("[data-color-prop]")) {
          input.value = validHex(palette[input.dataset.colorProp]) ? palette[input.dataset.colorProp] : "#777777";
        }
        document.getElementById("theme-glow").value = String(theme?.glow ?? 0);
        document.getElementById("theme-ambient").checked = Boolean(theme?.ambient ?? palette.ambient);
        editorError.textContent = "";
      }

      function refreshManagedThemes(selectedId = "") {
        managedTheme.replaceChildren(new Option("Create a new theme", ""));
        for (const theme of themes.filter(candidate => candidate.custom)) {
          managedTheme.add(new Option(theme.name, theme.id));
        }
        managedTheme.value = selectedId;
      }

      function readThemeEditor(id = "") {
        const name = editorName.value.trim();
        if (!name || name.length > 32) throw new Error("Enter a theme name of 1–32 characters.");
        const theme = {
          id: id || `custom-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`,
          name,
          glow: Number(document.getElementById("theme-glow").value),
          ambient: document.getElementById("theme-ambient").checked
        };
        for (const input of document.querySelectorAll("[data-color-prop]")) theme[input.dataset.colorProp] = input.value.toLowerCase();
        const invalidColors = colorProperties.filter(key => !validHex(theme[key]));
        if (invalidColors.length) throw new Error(`Choose a valid color for: ${invalidColors.join(", ")}.`);
        if (!Number.isInteger(theme.glow) || theme.glow < 0 || theme.glow > 40) {
          throw new Error("Accent glow must be between 0 and 40.");
        }
        if (!validCustomTheme(theme)) throw new Error("Check the theme name and settings.");
        return theme;
      }

      function bindDigit(digit) {
        digit.querySelector(".flap-bottom").addEventListener("animationend", event => {
          if (event.animationName !== "flip-in") return;
          const next = digit.dataset.target;
          const lower = digit.querySelector(".half.lower span");
          lower.textContent = next;
          digit.dataset.value = next;
          digit.classList.remove("flipping");
        });
      }

      function makeDigit() {
        const digit = document.createElement("div");
        digit.className = "digit";
        digit.innerHTML = '<div class="half upper"><span></span></div><div class="half lower"><span></span></div><div class="flap flap-top"><span></span></div><div class="flap flap-bottom"><span></span></div>';
        bindDigit(digit);
        return digit;
      }

      const groups = [];
      for (let groupIndex = 0; groupIndex < 3; groupIndex++) {
        const group = document.createElement("div");
        group.className = "digit-group";
        const digits = [makeDigit(), makeDigit()];
        digits.forEach(digit => group.append(digit));
        groups.push(digits);
        display.append(group);
      }
      function finishFlip(digit) {
        const next = digit.dataset.target;
        const [upper, lower] = digit.querySelectorAll(".half span");
        upper.textContent = next;
        lower.textContent = next;
        digit.dataset.value = next;
        digit.classList.remove("flipping");
      }

      function paintDigit(digit, value) {
        if (digit.classList.contains("flipping")) {
          if (digit.dataset.target === value) return;
          finishFlip(digit);
        }
        const [upper, lower, top, bottom] = digit.querySelectorAll("span");
        const old = digit.dataset.value || "";
        if (old === value) return;
        digit.dataset.target = value;
        if (!old) {
          upper.textContent = value;
          lower.textContent = value;
          digit.dataset.value = value;
          return;
        }
        top.textContent = old || value;
        upper.textContent = value;
        bottom.textContent = value;
        digit.classList.add("flipping");
      }

      function renderDigits(totalSeconds, isClock = false) {
        const time = Math.max(0, Math.floor(totalSeconds));
        const actualHours = Math.floor(time / 3600) % 24;
        const hours = isClock && state.hourFormat === "12" ? (actualHours % 12 || 12) : isClock ? actualHours : Math.floor(time / 3600) % 100;
        const minutes = Math.floor(time / 60) % 60;
        const seconds = time % 60;
        meridiem.textContent = actualHours < 12 ? "AM" : "PM";
        display.classList.toggle("has-meridiem", isClock && state.hourFormat === "12");
        const values = `${String(hours).padStart(2, "0")}${String(minutes).padStart(2, "0")}${String(seconds).padStart(2, "0")}`;
        for (let index = 0; index < 6; index++) {
          const value = values[index];
          paintDigit(groups[Math.floor(index / 2)][index % 2], value);
        }
      }

      function fields(items) {
        return `<div class="duration-settings">${items.map(({ key, label, value, min = 0, max }) => `
          <label class="duration-field"><input type="number" inputmode="numeric" min="${min}" max="${max}" step="1" value="${value}" data-duration="${key}" aria-label="${label}">${label}</label>
        `).join("")}</div>`;
      }

      function controls() {
        if (state.mode === "clock") {
          panel.innerHTML = `<button class="control-button icon-button" type="button" data-action="fullscreen" aria-label="Enter fullscreen" title="Fullscreen (F)">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
          </button>`;
          caption.textContent = "Local time";
          display.setAttribute("aria-label", "Current local time");
          return;
        }
        const active = state.mode === "timer" ? state.timerDeadline !== null : state.pomDeadline !== null;
        const pauseLabel = active ? "Pause" : "Start";
        const resetLabel = "Reset";
        let settings = "";
        if (state.mode === "timer") {
          settings = fields([
            { key: "hours", label: "h", value: state.timerConfig.hours, max: 99 },
            { key: "minutes", label: "m", value: state.timerConfig.minutes, max: 59 },
            { key: "seconds", label: "s", value: state.timerConfig.seconds, max: 59 }
          ]);
        } else {
          settings = fields([
            { key: "work", label: "work", value: state.pomConfig.work, min: 1, max: 180 },
            { key: "short", label: "short", value: state.pomConfig.short, min: 1, max: 60 },
            { key: "long", label: "long", value: state.pomConfig.long, min: 1, max: 90 }
          ]);
        }
        panel.innerHTML = `${settings}<div class="control-group">
          <button class="control-button primary" type="button" data-action="toggle">${pauseLabel}</button>
          <button class="control-button" type="button" data-action="reset">${resetLabel}</button>
          <button class="control-button icon-button" type="button" data-action="fullscreen" aria-label="Enter fullscreen" title="Fullscreen (F)">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
          </button>
        </div>`;
        for (const input of panel.querySelectorAll("input")) input.disabled = active;
        caption.textContent = state.mode === "timer" ? "Countdown" : `${state.pomPhase} · ${state.pomPhase === "Work" ? `Session ${state.workSessions + 1}` : "Take a breath"}`;
        display.setAttribute("aria-label", state.mode === "timer" ? "Timer countdown" : `${state.pomPhase} countdown`);
      }

      function durationFromInputs() {
        const { hours, minutes, seconds } = state.timerConfig;
        return hours * 3600 + minutes * 60 + seconds;
      }

      function currentPomDuration() {
        const key = state.pomPhase === "Work" ? "work" : state.pomPhase === "Short break" ? "short" : "long";
        return state.pomConfig[key] * 60;
      }

      function updateCaption() {
        if (state.mode === "pomodoro") {
          caption.textContent = `${state.pomPhase} · ${state.pomPhase === "Work" ? `Session ${state.workSessions + 1}` : "Take a breath"}`;
          display.setAttribute("aria-label", `${state.pomPhase} countdown`);
        }
      }

      function pauseActiveMode() {
        if (state.mode === "timer" && state.timerDeadline !== null) {
          state.timerRemaining = Math.max(0, Math.ceil((state.timerDeadline - Date.now()) / 1000));
          state.timerDeadline = null;
        }
        if (state.mode === "pomodoro" && state.pomDeadline !== null) {
          state.pomRemaining = Math.max(0, Math.ceil((state.pomDeadline - Date.now()) / 1000));
          state.pomDeadline = null;
        }
      }

      function setMode(mode) {
        if (mode === state.mode) return;
        pauseActiveMode();
        state.mode = mode;
        modeButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.mode === mode)));
        controls();
        updateDisplay();
      }

      function updateDisplay() {
        if (state.mode === "clock") {
          const now = new Date();
          renderDigits(now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds(), true);
          return;
        }
        const remaining = state.mode === "timer" ? state.timerRemaining : state.pomRemaining;
        renderDigits(remaining);
      }

      const displayPlaceholder = document.createComment("clock display location");
      display.parentNode.insertBefore(displayPlaceholder, display);
      let saverFrame = 0;
      let saverLastFrame = 0;
      let saverX = 0;
      let saverY = 0;
      let saverVx = 118;
      let saverVy = 86;
      let idleTimer = 0;
      let lastActivity = 0;

      function constrainSaverPosition() {
        const maxX = Math.max(0, screensaver.clientWidth - display.offsetWidth);
        const maxY = Math.max(0, screensaver.clientHeight - display.offsetHeight);
        saverX = Math.min(maxX, Math.max(0, saverX));
        saverY = Math.min(maxY, Math.max(0, saverY));
        display.style.transform = `translate3d(${saverX}px, ${saverY}px, 0)`;
      }

      function saverAnimationFrame(timestamp) {
        if (!state.screensaver || document.hidden) return;
        if (saverLastFrame) {
          const elapsed = Math.min((timestamp - saverLastFrame) / 1000, 0.05);
          saverX += saverVx * elapsed;
          saverY += saverVy * elapsed;
          const maxX = Math.max(0, screensaver.clientWidth - display.offsetWidth);
          const maxY = Math.max(0, screensaver.clientHeight - display.offsetHeight);
          if (saverX <= 0 || saverX >= maxX) {
            saverX = Math.min(maxX, Math.max(0, saverX));
            saverVx *= -1;
          }
          if (saverY <= 0 || saverY >= maxY) {
            saverY = Math.min(maxY, Math.max(0, saverY));
            saverVy *= -1;
          }
          display.style.transform = `translate3d(${saverX}px, ${saverY}px, 0)`;
        }
        saverLastFrame = timestamp;
        saverFrame = requestAnimationFrame(saverAnimationFrame);
      }

      function stopSaverAnimation() {
        if (saverFrame) cancelAnimationFrame(saverFrame);
        saverFrame = 0;
        saverLastFrame = 0;
      }

      function startSaverAnimation() {
        if (state.screensaver && !document.hidden && !saverFrame) {
          saverLastFrame = 0;
          saverFrame = requestAnimationFrame(saverAnimationFrame);
        }
      }

      function enterScreensaver() {
        if (state.screensaver || themeEditor.open) return;
        const rect = display.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        state.screensaver = true;
        screensaver.classList.add("active");
        screensaver.append(display);
        display.classList.add("screensaver-clock");
        display.style.width = `${rect.width}px`;
        display.style.height = `${rect.height}px`;
        saverX = Math.max(0, Math.min(screensaver.clientWidth - rect.width, rect.left));
        saverY = Math.max(0, Math.min(screensaver.clientHeight - rect.height, rect.top));
        display.style.left = "0";
        display.style.top = "0";
        updateDisplay();
        constrainSaverPosition();
        startSaverAnimation();
      }

      function exitScreensaver() {
        if (!state.screensaver) return;
        state.screensaver = false;
        stopSaverAnimation();
        displayPlaceholder.parentNode.insertBefore(display, displayPlaceholder);
        display.classList.remove("screensaver-clock");
        display.removeAttribute("style");
        screensaver.classList.remove("active");
        updateDisplay();
      }

      function resetIdleTimer() {
        window.clearTimeout(idleTimer);
        idleTimer = 0;
        if (state.saverDelay > 0 && !document.hidden && !state.screensaver && !themeEditor.open) {
          idleTimer = window.setTimeout(enterScreensaver, state.saverDelay);
        }
      }

      function registerActivity() {
        const now = Date.now();
        if (now - lastActivity < 650 && !state.screensaver) return;
        lastActivity = now;
        if (state.screensaver) exitScreensaver();
        resetIdleTimer();
      }

      function tick() {
        const now = Date.now();
        if (state.mode === "clock") {
          const current = new Date();
          renderDigits(current.getHours() * 3600 + current.getMinutes() * 60 + current.getSeconds(), true);
          return;
        }
        if (state.mode === "timer" && state.timerDeadline !== null) {
          state.timerRemaining = Math.max(0, Math.ceil((state.timerDeadline - now) / 1000));
          if (state.timerRemaining === 0) {
            state.timerDeadline = null;
            controls();
          }
        } else if (state.mode === "pomodoro" && state.pomDeadline !== null) {
          let transitions = 0;
          while (state.pomDeadline <= now && transitions < 10000) {
            if (state.pomPhase === "Work") {
              state.workSessions++;
              state.pomPhase = state.workSessions % 4 === 0 ? "Long break" : "Short break";
            } else {
              state.pomPhase = "Work";
            }
            state.pomRemaining = currentPomDuration();
            if (state.pomRemaining <= 0) {
              state.pomDeadline = null;
              break;
            }
            state.pomDeadline += state.pomRemaining * 1000;
            transitions++;
          }
          if (transitions === 10000 && state.pomDeadline <= now) {
            state.pomDeadline = now + currentPomDuration() * 1000;
          }
          state.pomRemaining = state.pomDeadline === null ? 0 : Math.max(0, Math.ceil((state.pomDeadline - now) / 1000));
          updateCaption();
          if (transitions) controls();
        }
        updateDisplay();
      }

      let tickTimer = 0;
      function scheduleTick() {
        window.clearTimeout(tickTimer);
        if (document.hidden) return;
        const now = Date.now();
        let delay = 1000 - now % 1000;
        const deadline = state.mode === "timer" ? state.timerDeadline : state.mode === "pomodoro" ? state.pomDeadline : null;
        if (deadline !== null) {
          const untilDisplayChange = (deadline - now) % 1000;
          delay = Math.min(delay, untilDisplayChange > 0 ? untilDisplayChange : 1000);
        }
        tickTimer = window.setTimeout(() => {
          tick();
          scheduleTick();
        }, Math.max(25, delay));
      }

      function toggleTimer() {
        if (state.timerDeadline !== null) {
          pauseActiveMode();
        } else {
          if (state.timerRemaining === 0) state.timerRemaining = durationFromInputs();
          if (state.timerRemaining > 0) state.timerDeadline = Date.now() + state.timerRemaining * 1000;
        }
        controls();
        updateDisplay();
      }

      function resetTimer() {
        state.timerDeadline = null;
        state.timerRemaining = durationFromInputs();
        controls();
        updateDisplay();
      }

      function togglePomodoro() {
        if (state.pomDeadline !== null) {
          pauseActiveMode();
        } else {
          if (state.pomRemaining <= 0) state.pomRemaining = currentPomDuration();
          state.pomDeadline = Date.now() + state.pomRemaining * 1000;
        }
        controls();
        updateDisplay();
      }

      function resetPomodoro() {
        state.pomDeadline = null;
        state.pomPhase = "Work";
        state.workSessions = 0;
        state.pomRemaining = currentPomDuration();
        controls();
        updateDisplay();
      }

      function setTheme(index, direction = 1) {
        if (state.themeSwitching) return;
        state.themeSwitching = true;
        state.themeIndex = (index + themes.length) % themes.length;
        const theme = themes[state.themeIndex];
        themeSwitcher.setAttribute("aria-busy", "true");
        document.documentElement.dataset.wipeDirection = direction < 0 ? "reverse" : "forward";
        const applyTheme = () => {
          document.documentElement.dataset.theme = theme.id;
          document.documentElement.style.colorScheme = theme.scheme;
          setCustomThemeStyle(theme);
          themeColor.content = theme.color;
          updateThemeMeta();
          if (typeof document.startViewTransition === "function") {
            themeWipeEdge.style.viewTransitionName = "wipe-edge";
            themeWipeEdge.style.opacity = "1";
          }
        };
        const finishTransition = () => {
          themeSwitcher.removeAttribute("aria-busy");
          themeWipeEdge.style.viewTransitionName = "none";
          themeWipeEdge.style.opacity = "0";
          delete document.documentElement.dataset.wipeDirection;
          state.themeSwitching = false;
          persistSettings();
        };

        if (typeof document.startViewTransition === "function") {
          document.startViewTransition(applyTheme).finished.then(finishTransition, finishTransition);
        } else {
          applyTheme();
          window.setTimeout(finishTransition, 720);
        }
      }

      let editingThemeId = "";
      function openThemeEditor() {
        refreshManagedThemes(editingThemeId);
        fillThemeEditor(themes.find(theme => theme.id === editingThemeId));
        if (!themeEditor.open) themeEditor.showModal();
      }

      function editorSourceTheme() {
        return themes.find(theme => theme.id === editingThemeId) || themes[state.themeIndex];
      }

      function saveThemeFromEditor() {
        if (state.themeSwitching) {
          editorError.textContent = "Wait for the current theme transition to finish.";
          return;
        }
        try {
          const theme = readThemeEditor(editingThemeId);
          const previous = [...themes];
          const existingIndex = themes.findIndex(candidate => candidate.id === editingThemeId);
          if (existingIndex >= 0) themes[existingIndex] = toCarouselTheme(theme);
          else themes.push(toCarouselTheme(theme));
          if (!persistCustomThemes()) {
            themes.splice(0, themes.length, ...previous);
            return;
          }
          const index = themes.findIndex(candidate => candidate.id === theme.id);
          editingThemeId = theme.id;
          refreshManagedThemes(editingThemeId);
          themeEditor.close();
          setTheme(index, 1);
        } catch (error) {
          editorError.textContent = error.message;
        }
      }

      function deleteThemeFromEditor() {
        if (!editingThemeId) {
          editorError.textContent = "Built-in themes cannot be deleted.";
          return;
        }
        const theme = themes.find(candidate => candidate.id === editingThemeId);
        if (!theme || !window.confirm(`Delete “${theme.name}”?`)) return;
        const deletedIndex = themes.indexOf(theme);
        const wasSelected = state.themeIndex === deletedIndex;
        const previous = [...themes];
        themes.splice(deletedIndex, 1);
        if (!persistCustomThemes()) {
          themes.splice(0, themes.length, ...previous);
          return;
        }
        editingThemeId = "";
        refreshManagedThemes();
        fillThemeEditor(null);
        if (wasSelected) {
          state.themeIndex = 0;
          setTheme(0, 1);
        } else {
          if (deletedIndex < state.themeIndex) state.themeIndex--;
          if (state.themeIndex >= themes.length) state.themeIndex = themes.length - 1;
          updateThemeMeta();
          persistSettings();
        }
        announce("Custom theme deleted.");
      }

      function enterFullscreen() {
        if (state.fullscreen) return;
        state.fullscreen = true;
        document.documentElement.classList.add("fullscreen-mode");
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {
            announce("Browser fullscreen is unavailable; HOUR's fullscreen layout remains active.");
          });
        }
      }

      function exitFullscreen() {
        state.fullscreen = false;
        document.documentElement.classList.remove("fullscreen-mode");
        if (document.fullscreenElement) document.exitFullscreen().catch(() => announce("The browser could not exit fullscreen."));
      }

      modeButtons.forEach((button, index) => button.addEventListener("click", () => {
        modeIndicator.style.transform = `translateX(${index * 100}%)`;
        setMode(button.dataset.mode);
        scheduleTick();
      }));
      themeSwitcher.addEventListener("click", event => {
        const button = event.target.closest("[data-theme-step]");
        if (!button) return;
        const direction = Number(button.dataset.themeStep);
        setTheme(state.themeIndex + direction, direction);
      });
      panel.addEventListener("click", event => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "fullscreen") enterFullscreen();
        if (action === "screensaver") enterScreensaver();
        if (action === "toggle") state.mode === "timer" ? toggleTimer() : togglePomodoro();
        if (action === "reset") state.mode === "timer" ? resetTimer() : resetPomodoro();
        scheduleTick();
      });
      document.querySelector(".topbar-actions").addEventListener("click", event => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "screensaver") enterScreensaver();
        if (action === "theme-editor") openThemeEditor();
      });
      themeEditor.addEventListener("click", event => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "close-editor") themeEditor.close();
        if (action === "new-theme") {
          editingThemeId = "";
          managedTheme.value = "";
          fillThemeEditor(null, "My Theme");
          editorName.focus();
        }
        if (action === "duplicate-theme") {
          const source = editorSourceTheme();
          editingThemeId = "";
          managedTheme.value = "";
          fillThemeEditor(source.custom ? source : { ...currentPalette(), glow: 0 }, `${source.name} Copy`);
          editorName.value = `${source.name} Copy`.slice(0, 32);
          editorName.focus();
        }
        if (action === "delete-theme") deleteThemeFromEditor();
        if (action === "save-theme") saveThemeFromEditor();
      });
      managedTheme.addEventListener("change", () => {
        editingThemeId = managedTheme.value;
        fillThemeEditor(themes.find(theme => theme.id === editingThemeId));
      });
      themeEditor.addEventListener("close", resetIdleTimer);
      screensaverDelay.value = String(state.saverDelay);
      hourFormatControl.value = state.hourFormat;
      hourFormatControl.addEventListener("change", () => {
        state.hourFormat = hourFormatControl.value === "12" ? "12" : "24";
        persistSettings();
        updateDisplay();
      });
      screensaverDelay.addEventListener("change", () => {
        state.saverDelay = Number(screensaverDelay.value);
        persistSettings();
        resetIdleTimer();
      });
      panel.addEventListener("change", event => {
        const input = event.target.closest("[data-duration]");
        if (!input) return;
        const max = Number(input.max);
        const min = Number(input.min) || 0;
        input.value = String(Math.min(max, Math.max(min, safeInt(input, min))));
        if (state.mode === "timer") {
          state.timerConfig[input.dataset.duration] = safeInt(input, min);
          state.timerRemaining = durationFromInputs();
        } else {
          state.pomConfig[input.dataset.duration] = safeInt(input, min);
          state.pomRemaining = currentPomDuration();
        }
        persistSettings();
        updateDisplay();
        scheduleTick();
      });
      document.addEventListener("keydown", event => {
        if (state.screensaver && event.key === "Escape") {
          event.preventDefault();
          exitScreensaver();
          resetIdleTimer();
          return;
        }
        registerActivity();
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key.toLowerCase() === "f" && !event.target.matches("input, textarea, select")) {
          event.preventDefault();
          state.fullscreen ? exitFullscreen() : enterFullscreen();
        } else if (event.key === "Escape" && state.fullscreen) {
          exitFullscreen();
        }
      });
      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) {
          state.fullscreen = false;
          document.documentElement.classList.remove("fullscreen-mode");
        }
      });
      document.addEventListener("pointerdown", registerActivity, { passive: true });
      document.addEventListener("pointermove", event => {
        if (state.screensaver || Math.abs(event.movementX) + Math.abs(event.movementY) > 2) registerActivity();
      }, { passive: true });
      window.addEventListener("resize", () => {
        if (state.screensaver) constrainSaverPosition();
      }, { passive: true });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          window.clearTimeout(idleTimer);
          idleTimer = 0;
          window.clearTimeout(tickTimer);
          stopSaverAnimation();
          return;
        }
        tick();
        scheduleTick();
        startSaverAnimation();
        resetIdleTimer();
      });

      const initialTheme = themes[state.themeIndex];
      document.documentElement.dataset.theme = initialTheme.id;
      document.documentElement.style.colorScheme = initialTheme.scheme;
      setCustomThemeStyle(initialTheme);
      themeColor.content = initialTheme.color;
      updateThemeMeta();
      refreshManagedThemes();
      controls();
      tick();
      scheduleTick();
      resetIdleTimer();
    })();
  </script>
</body>
</html>
