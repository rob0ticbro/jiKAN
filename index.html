<!doctype html>
<html lang="en" data-theme="obsidian">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>jiKAN — 時計</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #f3f2ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #777773;
      --line: #222220;
      --panel: #111110;
      --page: #000;
      --foreground: #f3f2ef;
      --subtle: #777773;
      --edge: #252523;
      --input-bg: #0c0c0b;
      --input-fg: #e9e8e3;
      --segment-bg: #080808;
      --segment-edge: #1d1d1b;
      --segment-active: #20201e;
      --segment-active-edge: #30302d;
      --digit-bg: linear-gradient(110deg, #171716, #10100f 54%, #171716);
      --face-bg: linear-gradient(105deg, #1a1a19, #121211 55%, #191918);
      --digit-ink: #efeee9;
      --seam: #050505;
      --tile-shadow: inset 1px 0 1px #ffffff08, inset -1px 0 1px #000, 0 2px 3px #000, 0 12px 26px #0009;
      --theme-accent: #dedbd2;
      --ambient-bg: none;
      --clock-font-size: clamp(5rem, min(22vw, 44vh), 22rem);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--page);
      background-image: var(--ambient-bg);
      color: var(--foreground);
      transition: background-color 700ms ease, color 700ms ease;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app-shell {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      padding: 34px clamp(20px, 5vw, 72px) 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
    }

    .theme-switcher {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    .brand {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 8px 11px;
      margin: -8px -11px;
      border-radius: 10px;
      color: var(--foreground);
      font-size: 21px;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: none;
      cursor: default;
      transition: transform .24s ease, color .24s ease, text-shadow .24s ease;
    }

    .brand::before, .brand::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      content: "";
      opacity: 0;
      pointer-events: none;
    }

    .brand::before {
      background: radial-gradient(
        circle at var(--spot-x, 50%) var(--spot-y, 50%),
        color-mix(in srgb, var(--theme-accent) 24%, transparent),
        color-mix(in srgb, var(--foreground) 7%, transparent) 38%,
        transparent 74%
      );
      transition: opacity .24s ease;
    }

    .brand::after {
      background: linear-gradient(112deg, transparent 24%, color-mix(in srgb, var(--foreground) 26%, transparent) 48%, transparent 68%);
      transform: translateX(-125%) skewX(-12deg);
    }

    .brand:hover {
      color: var(--foreground);
      text-shadow: 0 0 14px color-mix(in srgb, var(--theme-accent) 48%, transparent);
      transform: translateY(-1px) scale(1.025);
    }

    .brand:hover::before { opacity: 1; }
    .brand:hover::after { opacity: 1; animation: brand-sheen 850ms cubic-bezier(.2, .7, .2, 1) both; }

    @keyframes brand-sheen {
      to { transform: translateX(125%) skewX(-12deg); }
    }

    .brand small {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .08em;
      transition: color .24s ease;
    }

    .brand:hover small { color: var(--foreground); }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .topbar-actions .control-button { min-width: 0; }

    .settings-toggle.control-button.icon-button { min-width: 48px; width: 48px; height: 48px; }
    .settings-toggle.control-button.icon-button svg { width: 26px; height: 26px; overflow: visible; }
    .settings-toggle svg path { fill: none; stroke: currentColor; stroke-width: 1.8; }
    .settings-toggle svg circle { stroke: currentColor; stroke-width: 1.8; }

    .theme-arrow {
      position: relative;
      z-index: 0;
      display: grid;
      width: 34px;
      height: 34px;
      overflow: hidden;
      place-items: center;
      border: 1px solid var(--edge);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 24%, color-mix(in srgb, var(--foreground) 7%, var(--panel)), var(--panel) 76%);
      color: var(--subtle);
      cursor: pointer;
      box-shadow: inset 0 1px 2px color-mix(in srgb, var(--foreground) 18%, transparent), inset 0 -2px 3px color-mix(in srgb, var(--page) 55%, transparent), inset 1px 0 1px color-mix(in srgb, var(--foreground) 8%, transparent);
      isolation: isolate;
      transition: color 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .theme-arrow::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        circle at var(--spot-x, 50%) var(--spot-y, 50%),
        color-mix(in srgb, var(--foreground) 16%, var(--panel)),
        color-mix(in srgb, var(--foreground) 7%, var(--panel)) 48%,
        transparent 78%
      );
      content: "";
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }
    .theme-arrow:hover { transform: scale(1.06); color: var(--foreground); }
    .theme-arrow:hover::before { opacity: 1; }
    .theme-arrow:active { transform: scale(.96); }
    .theme-arrow svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }

    .theme-current { min-width: 138px; text-align: center; }
    .theme-name {
      display: block;
      color: var(--foreground);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .02em;
      transition: color 350ms ease, opacity 240ms ease, transform 240ms ease;
    }

    .theme-count {
      display: block;
      margin-top: 3px;
      color: var(--subtle);
      font-size: 9px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    @supports (view-transition-name: root) {
      ::view-transition-old(root) {
        animation: none;
        z-index: 1;
      }

      ::view-transition-new(root) {
        position: relative;
        z-index: 2;
        will-change: clip-path;
        clip-path: inset(0 100% 0 0);
        animation: theme-reveal-forward 720ms cubic-bezier(.4, 0, .75, .85) both;
      }

      :root[data-wipe-direction="reverse"]::view-transition-new(root) {
        clip-path: inset(0 0 0 100%);
        animation-name: theme-reveal-reverse;
      }

      ::view-transition-group(wipe-edge) {
        z-index: 3;
        animation-duration: 720ms;
      }

      ::view-transition-new(wipe-edge) {
        will-change: transform;
        animation: theme-reveal-edge-forward 720ms cubic-bezier(.4, 0, .75, .85) both;
      }

      :root[data-wipe-direction="reverse"]::view-transition-new(wipe-edge) {
        animation-name: theme-reveal-edge-reverse;
      }

      @keyframes theme-reveal-forward {
        from { clip-path: inset(0 100% 0 0); }
        to { clip-path: inset(0 0 0 0); }
      }

      @keyframes theme-reveal-edge-forward {
        from { transform: translate3d(-2px, 0, 0); }
        to { transform: translate3d(100vw, 0, 0); }
      }

      @keyframes theme-reveal-reverse {
        from { clip-path: inset(0 0 0 100%); }
        to { clip-path: inset(0 0 0 0); }
      }

      @keyframes theme-reveal-edge-reverse {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(-100vw, 0, 0); }
      }

      :root[data-wipe-direction="reverse"] .theme-wipe-edge { left: auto; right: -2px; }
    }

    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 5vh, 52px);
      padding: 25px 0;
    }

    .mode-tabs {
      position: relative;
      display: grid;
      width: min(402px, calc(100vw - 32px));
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      isolation: isolate;
    }

    .mode-indicator {
      position: absolute;
      z-index: -1;
      top: 0;
      bottom: 0;
      left: 0;
      width: calc(100% / 3);
      border: 0;
      border-radius: 12px;
      background: var(--segment-active);
      box-shadow: inset 0 1px #ffffff12, 0 2px 8px #0001;
      transform: translateX(0);
      transform: translateX(0);
      transition: transform 620ms cubic-bezier(.22, 1, .36, 1), background-color 240ms ease, border-color 240ms ease;
      pointer-events: none;
    }

    .mode-tab {
      position: relative;
      z-index: 1;
      overflow: hidden;
      isolation: isolate;
      min-width: 0;
      padding: 13px 15px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--subtle);
      cursor: pointer;
      font-size: 15px;
      transition: color 280ms ease;
    }

    .mode-tab::before, .settings-tab::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        circle at var(--spot-x, 50%) var(--spot-y, 50%),
        color-mix(in srgb, var(--foreground) 10%, var(--page)),
        color-mix(in srgb, var(--foreground) 5%, var(--page)) 42%,
        transparent 74%
      );
      content: "";
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }

    .mode-tab:hover { color: var(--foreground); }

    .mode-tab:hover::before, .settings-tab:hover::before { opacity: 1; }
    .mode-tab[aria-pressed="true"] { color: var(--foreground); }
    .mode-tab:focus-visible {
      outline: 2px solid var(--theme-accent);
      outline-offset: 3px;
    }

    .clock-stage {
      display: flex;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .mode-caption {
      min-height: 19px;
      margin-bottom: 28px;
      color: var(--subtle);
      font-size: 11px;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .clock-display {
      position: relative;
      display: flex;
      align-items: center;
      gap: clamp(10px, 2.4vw, 36px);
      filter: drop-shadow(0 20px 34px #000);
      font-variant-numeric: tabular-nums;
      transform: var(--clock-position, translate3d(0, 0, 0));
      transform-origin: center;
      transition: filter 700ms ease;
    }

    .meridiem {
      position: absolute;
      right: clamp(-48px, -4vw, -24px);
      bottom: 8%;
      color: var(--subtle);
      font-size: clamp(.65rem, 1.8vw, 1rem);
      letter-spacing: .12em;
      opacity: 0;
      visibility: hidden;
      transition: opacity 180ms ease, visibility 180ms ease;
      pointer-events: none;
    }

    .clock-display.has-meridiem:hover .meridiem,
    .clock-display.has-meridiem:focus-within .meridiem { opacity: 1; visibility: visible; }

    .digit-group {
      display: flex;
      gap: clamp(3px, .45vw, 8px);
    }

    .digit {
      position: relative;
      width: .58em;
      height: 1.16em;
      overflow: hidden;
      border: 1px solid var(--edge);
      border-radius: .085em;
      background: var(--digit-bg);
      box-shadow: var(--tile-shadow);
      color: var(--digit-ink);
      transition: background 700ms ease, border-color 700ms ease, color 700ms ease, box-shadow 700ms ease;
      font-family: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif;
      font-size: var(--clock-font-size);
      font-weight: 300;
      line-height: 1;
      perspective: 700px;
      text-align: center;
    }

    .digit::after {
      position: absolute;
      z-index: 5;
      top: 50%;
      right: 0;
      left: 0;
      height: 1px;
      background: var(--seam);
      box-shadow: none;
      opacity: .55;
      content: "";
    }

    .half, .flap {
      position: absolute;
      right: 0;
      left: 0;
      display: flex;
      height: 50%;
      overflow: hidden;
      align-items: center;
      justify-content: center;
      background: var(--face-bg);
      backface-visibility: hidden;
      transition: background 700ms ease;
    }

    .half span, .flap span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 200%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.16em;
    }

    .upper { top: 0; border-radius: .08em .08em 0 0; }
    .upper span, .flap-top span { top: 0; }
    .lower { bottom: 0; border-radius: 0 0 .08em .08em; }
    .lower span, .flap-bottom span { bottom: 0; }

    .flap {
      z-index: 3;
      visibility: hidden;
    }

    .flap-top {
      top: 0;
      z-index: 4;
      transform-origin: bottom;
    }

    .flap-bottom {
      bottom: 0;
      z-index: 2;
      transform: rotateX(90deg);
      transform-origin: top;
    }

    .digit.flipping .flap { visibility: visible; }
    .digit.flipping .flap-top { animation: flip-away .28s cubic-bezier(.45, 0, .8, .25) forwards; }
    .digit.flipping .flap-bottom { animation: flip-in .3s .25s cubic-bezier(.15, .7, .25, 1) forwards; }

    @keyframes flip-away {
      from { transform: rotateX(0); }
      to { transform: rotateX(-90deg); }
    }

    @keyframes flip-in {
      from { transform: rotateX(90deg); }
      to { transform: rotateX(0); }
    }

    .separator {
      align-self: center;
      margin: 0 .01em;
      color: var(--subtle);
      font-size: clamp(3rem, 8vw, 8rem);
      font-weight: 200;
      line-height: 1;
      transform: translateY(-.04em);
    }

    .control-panel {
      display: flex;
      height: 148px;
      min-height: 148px;
      align-items: flex-start;
      justify-content: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .control-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .duration-settings {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
    }

    .duration-field {
      display: flex;
      align-items: baseline;
      gap: 7px;
      color: var(--subtle);
      font-size: 13px;
    }

    .duration-input-wrap {
      position: relative;
      display: inline-flex;
      width: 92px;
      height: 58px;
      flex: 0 0 92px;
    }

    .duration-field input {
      width: 100%;
      height: 100%;
      padding: 10px 29px 10px 8px;
      border: 1px solid var(--edge);
      border-radius: 6px;
      outline: none;
      background: var(--input-bg);
      color: var(--input-fg);
      text-align: center;
      font-size: 20px;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .duration-field input::-webkit-inner-spin-button,
    .duration-field input::-webkit-outer-spin-button { margin: 0; appearance: none; }
    .duration-input-wrap:focus-within input { border-color: var(--subtle); }
    .duration-input-wrap input:disabled { opacity: .48; }
    .duration-stepper {
      position: absolute;
      top: 4px;
      right: 4px;
      bottom: 4px;
      display: flex;
      width: 21px;
      flex-direction: column;
      overflow: hidden;
      border-radius: 3px;
    }
    .duration-stepper button {
      display: grid;
      min-height: 0;
      flex: 1;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--subtle);
      cursor: pointer;
      transition: background-color .16s ease, color .16s ease;
    }
    .duration-stepper button + button { border-top: 1px solid color-mix(in srgb, var(--edge) 68%, transparent); }
    .duration-stepper button:hover:not(:disabled) { background: color-mix(in srgb, var(--foreground) 10%, var(--input-bg)); color: var(--foreground); }
    .duration-stepper button:active:not(:disabled) { background: color-mix(in srgb, var(--theme-accent) 24%, var(--input-bg)); }
    .duration-stepper button:focus-visible { outline: 1px solid var(--theme-accent); outline-offset: -2px; }
    .duration-stepper button:disabled { cursor: default; opacity: .4; }
    .duration-stepper svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }

    .control-button {
      position: relative;
      z-index: 0;
      display: inline-flex;
      min-width: 84px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
      padding: 11px 16px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--foreground);
      cursor: pointer;
      font-size: 14px;
      font-weight: 550;
      transition: color .18s ease, transform .18s ease;
      isolation: isolate;
    }

    .control-button::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        circle at var(--spot-x, 50%) var(--spot-y, 50%),
        color-mix(in srgb, var(--foreground) 10%, var(--page)),
        color-mix(in srgb, var(--foreground) 5%, var(--page)) 42%,
        transparent 74%
      );
      content: "";
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }

    .control-button:hover::before { opacity: 1; }
    .control-button.primary::before { display: none; }
    html[data-theme] .control-button.primary:hover {
      background: color-mix(in srgb, var(--theme-accent) 84%, white);
    }
    .control-button:active { transform: scale(.97); }
    .control-button:focus-visible, .theme-arrow:focus-visible {
      outline: 2px solid var(--theme-accent);
      outline-offset: 3px;
    }

    .action-button {
      min-width: 92px;
      min-height: 68px;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
    }

    .action-button svg { width: 21px; height: 21px; }
    .mode-actions .primary { min-width: 108px; }

    .control-button.icon-button {
      display: inline-flex;
      min-width: 68px;
      width: 68px;
      height: 68px;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
      font-size: 11px;
    }

    .control-button.icon-button:not(.settings-toggle) {
      min-width: 76px;
      width: 76px;
      height: 76px;
      padding: 12px;
    }

    .control-button.icon-button svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.6;
    }

    .control-button.primary {
      background: var(--theme-accent);
      color: var(--page);
      font-weight: 600;
    }

    .fullscreen-mode, .fullscreen-mode body { width: 100%; height: 100%; min-height: 100%; overflow: hidden; cursor: none; }
    .fullscreen-mode .topbar,
    .fullscreen-mode .mode-tabs,
    .fullscreen-mode .mode-caption,
    .fullscreen-mode .control-panel { display: none; }
    .fullscreen-mode .meridiem { opacity: 0 !important; visibility: hidden !important; }


    @media (max-width: 620px) {
      .app-shell { padding: 22px 16px; }
      .theme-switcher { gap: 7px; }
      .theme-current { min-width: 112px; }
      .theme-arrow { width: 30px; height: 30px; }
      .brand { display: none; }
      .topbar-actions { gap: 6px; }
      .topbar-actions .control-button { padding: 8px 10px; font-size: 11px; }
      .mode-tab { min-width: 72px; padding: 9px 10px; }
      .clock-stage { margin: 0; }
      .clock-display { gap: clamp(7px, 2vw, 18px); }
      .digit-group { gap: 3px; }
      .separator { font-size: clamp(2.4rem, 8vw, 5rem); }
      .control-panel { max-width: 100%; flex-wrap: wrap; }
      .control-group { gap: 6px; }
      .action-button { min-width: 72px; min-height: 62px; }
      .control-button.icon-button:not(.settings-toggle) { min-width: 64px; width: 64px; height: 68px; padding: 8px; }
      .control-panel { height: 196px; min-height: 196px; }
      .duration-settings { flex-wrap: wrap; justify-content: center; }
      .theme-form { grid-template-columns: 1fr; }
      .theme-form .glow-field { grid-column: auto; }
    }

    @media (max-height: 760px) {
      .app-shell { padding-top: 20px; padding-bottom: 16px; }
      .workspace { padding: 18px 0; gap: clamp(18px, 3vh, 30px); }
      .theme-editor .editor-content { padding-top: 22px; padding-bottom: 22px; }
      .theme-editor .editor-section { margin-top: 14px; padding-top: 12px; }
      .theme-editor .theme-form { gap: 5px 18px; }
      .theme-editor .theme-form label { min-height: 32px; }
      .theme-editor .theme-form input[type="color"] { height: 32px; }
      .theme-editor .editor-heading { margin-bottom: 12px; }
    }

    @media (max-width: 620px) and (max-height: 760px) {
      .theme-editor .theme-form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .theme-editor .theme-form .glow-field { grid-column: 1 / -1; }
      .theme-editor .editor-content { padding: 18px; }
      .theme-editor .editor-actions { gap: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      .digit.flipping .flap-top { animation-duration: .14s; }
      .digit.flipping .flap-bottom { animation-duration: .14s; animation-delay: .12s; }
      .mode-indicator, .mode-tab, .settings-indicator, .settings-tab, .format-indicator { transition-duration: .01ms; }
      body, .digit, .half, .flap, .theme-name, .theme-editor { transition-duration: .01ms; }
      ::view-transition-new(root),
      ::view-transition-new(wipe-edge) { animation-duration: .01ms !important; }
    }

    html[data-theme="light"] {
      color-scheme: light;

    html[data-theme="catppuccin-latte"] .control-button.primary,
    html[data-theme="solarized-light"] .control-button.primary {
      border-color: var(--theme-accent);
      background: var(--theme-accent);
      color: #fff;
    }

    .theme-arrow:disabled { opacity: .48; cursor: default; transform: none; }

    .theme-editor {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(580px, 94vw);
      height: 100vh;
      max-height: 100dvh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      border: 0;
      border-left: 1px solid var(--edge);
      border-radius: 20px 0 0 20px;
      background: color-mix(in srgb, var(--page) 94%, var(--panel));
      color: var(--foreground);
      box-shadow: -28px 0 90px #0007;
      transform: translateX(102%);
      transition: transform 420ms cubic-bezier(.22, 1, .36, 1);
    }

    .theme-editor::-webkit-scrollbar { display: none; }
    .theme-editor.visible { transform: translateX(0); }
    .theme-editor::backdrop { background: #0009; }
    .editor-content { padding: clamp(24px, 3.2vw, 34px); }
    .editor-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .editor-heading h2 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.025em; }
    .editor-heading p { margin: 6px 0 0; color: var(--subtle); font-size: 13px; line-height: 1.5; }
    .editor-close { min-width: 42px; width: 42px; height: 42px; padding: 0; font-size: 22px; }
    .settings-tabs {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      isolation: isolate;
    }
    .settings-indicator {
      position: absolute;
      z-index: -1;
      inset: 0 auto 0 0;
      width: 50%;
      border-radius: 12px;
      background: var(--segment-active);
      box-shadow: inset 0 1px #ffffff12, 0 2px 8px #0001;
      transition: transform 620ms cubic-bezier(.22, 1, .36, 1), background-color 240ms ease;
      pointer-events: none;
    }
    .settings-tab {
      position: relative;
      z-index: 1;
      overflow: hidden;
      isolation: isolate;
      min-width: 0;
      min-height: 40px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--subtle);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      transition: color .2s ease;
    }
    .settings-tab:hover { color: var(--foreground); }
    .settings-tab[aria-selected="true"] { color: var(--foreground); }
    .settings-tab:focus-visible { outline: 2px solid var(--theme-accent); outline-offset: 3px; }
    .settings-panel[hidden] { display: none; }
    .editor-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--edge); }
    .editor-section h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; letter-spacing: .01em; }
    .settings-panel.editor-section { margin-top: 22px; padding-top: 0; border-top: 0; }
    .settings-panel > .editor-section { margin-top: 22px; padding-top: 20px; }
    .theme-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; }
    .theme-form label, .saver-settings label { display: flex; min-height: 48px; align-items: center; justify-content: space-between; gap: 16px; color: var(--subtle); font-size: 13px; }
    .theme-form input[type="text"], .theme-form select, .saver-settings select {
      min-width: 0;
      min-height: 42px;
      padding: 9px 36px 9px 12px;
      border: 1px solid var(--edge);
      border-radius: 9px;
      outline: none;
      background: var(--input-bg);
      color: var(--input-fg);
      font: inherit;
      font-size: 13px;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--subtle) 50%), linear-gradient(135deg, var(--subtle) 50%, transparent 50%);
      background-position: calc(100% - 17px) 18px, calc(100% - 12px) 18px;
      background-repeat: no-repeat;
      background-size: 5px 5px;
    }
    .theme-form input[type="text"] { padding-right: 12px; background-image: none; }
    .theme-form select:focus, .saver-settings select:focus { border-color: var(--theme-accent); }
    .theme-form input[type="color"] { width: 48px; height: 32px; padding: 0; border: 0; border-radius: 4px; background: transparent; cursor: pointer; }
    .theme-form input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .theme-form input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 4px; }
    .theme-form input[type="color"]::-moz-color-swatch { border: 0; border-radius: 4px; }
    @property --range-progress {
      syntax: "<percentage>";
      inherits: true;
      initial-value: 0%;
    }

    .theme-form input[type="range"], .settings-panel input[type="range"] {
      width: min(190px, 45%);
      height: 24px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 999px;
      outline: none;
      background: transparent;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      --range-progress: 0%;
    }
    .theme-form input[type="range"]::-webkit-slider-runnable-track,
    .settings-panel input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border: 1px solid color-mix(in srgb, var(--edge) 80%, transparent);
      border-radius: 999px;
      background: linear-gradient(to right, var(--theme-accent) 0 var(--range-progress), color-mix(in srgb, var(--subtle) 24%, var(--input-bg)) var(--range-progress) 100%);
      box-shadow: inset 0 1px 2px color-mix(in srgb, var(--page) 25%, transparent);
    }
    .theme-form input[type="range"]::-moz-range-track,
    .settings-panel input[type="range"]::-moz-range-track {
      height: 7px;
      border: 1px solid color-mix(in srgb, var(--edge) 80%, transparent);
      border-radius: 999px;
      background: linear-gradient(to right, var(--theme-accent) 0 var(--range-progress), color-mix(in srgb, var(--subtle) 24%, var(--input-bg)) var(--range-progress) 100%);
      box-shadow: inset 0 1px 2px color-mix(in srgb, var(--page) 25%, transparent);
    }
    .theme-form input[type="range"]::-webkit-slider-thumb,
    .settings-panel input[type="range"]::-webkit-slider-thumb {
      width: 17px;
      height: 17px;
      margin-top: -5px;
      border: 1px solid color-mix(in srgb, var(--theme-accent) 78%, white);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--theme-accent) 72%, white), var(--theme-accent) 68%);
      box-shadow: inset 0 1px 2px #ffffff55, inset 0 -2px 3px #0003, 0 1px 4px #0004;
      transition: box-shadow .18s ease, transform .18s ease;
      appearance: none;
      -webkit-appearance: none;
    }
    .theme-form input[type="range"]::-moz-range-thumb,
    .settings-panel input[type="range"]::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border: 1px solid color-mix(in srgb, var(--theme-accent) 78%, white);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--theme-accent) 72%, white), var(--theme-accent) 68%);
      box-shadow: inset 0 1px 2px #ffffff55, inset 0 -2px 3px #0003, 0 1px 4px #0004;
      transition: box-shadow .18s ease, transform .18s ease;
    }
    .theme-form input[type="range"]:hover::-webkit-slider-thumb,
    .settings-panel input[type="range"]:hover::-webkit-slider-thumb,
    .theme-form input[type="range"]:focus-visible::-webkit-slider-thumb,
    .settings-panel input[type="range"]:focus-visible::-webkit-slider-thumb,
    .theme-form input[type="range"]:hover::-moz-range-thumb,
    .settings-panel input[type="range"]:hover::-moz-range-thumb,
    .theme-form input[type="range"]:focus-visible::-moz-range-thumb,
    .settings-panel input[type="range"]:focus-visible::-moz-range-thumb {
      box-shadow: inset 0 1px 2px #ffffff77, inset 0 -2px 3px #0003, 0 0 0 4px color-mix(in srgb, var(--theme-accent) 18%, transparent), 0 2px 7px #0004;
      transform: scale(1.08);
    }
    .theme-form input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--theme-accent); }
    .theme-form .glow-field { grid-column: 1 / -1; }
    .editor-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 16px; }
    .editor-actions .danger { color: #ef7777; }
    .editor-actions .spacer { flex: 1; }
    .saver-settings {
      display: grid;
      gap: 0;
      padding: 4px 16px;
      border: 1px solid var(--edge);
      border-radius: 13px;
      background: color-mix(in srgb, var(--panel) 58%, var(--page));
    }
    .saver-settings label + label { border-top: 1px solid color-mix(in srgb, var(--edge) 72%, transparent); }
    .saver-settings select { width: min(220px, 52%); }
    .custom-select-wrap { position: relative; flex: 0 1 min(220px, 52%); min-width: 0; }
    .theme-form .custom-select-wrap { flex-basis: min(250px, 58%); }
    .custom-select-wrap > select { display: none; }
    .custom-select-trigger {
      display: flex;
      width: 100%;
      min-height: 42px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 13px;
      border: 1px solid var(--edge);
      border-radius: 9px;
      background: var(--input-bg);
      color: var(--input-fg);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      text-align: left;
      transition: border-color .2s ease, background-color .2s ease;
    }
    .custom-select-trigger:hover, .custom-select-wrap.open .custom-select-trigger { border-color: color-mix(in srgb, var(--theme-accent) 70%, var(--edge)); }
    .custom-select-trigger:focus-visible { outline: 2px solid var(--theme-accent); outline-offset: 2px; }
    .custom-select-trigger svg { width: 13px; height: 13px; flex: 0 0 auto; fill: none; stroke: var(--subtle); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; transition: transform .22s ease; }
    .custom-select-wrap.open .custom-select-trigger svg { transform: rotate(180deg); }
    .custom-select-menu {
      position: absolute;
      z-index: 15;
      top: calc(100% + 7px);
      right: 0;
      left: 0;
      max-height: min(240px, 40vh);
      overflow: auto;
      padding: 5px;
      border: 1px solid var(--edge);
      border-radius: 11px;
      background: color-mix(in srgb, var(--panel) 94%, var(--page));
      box-shadow: 0 14px 36px #0005;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-7px) scale(.985);
      transform-origin: top center;
      transition: opacity .18s ease, transform .22s cubic-bezier(.22, 1, .36, 1), visibility .18s;
    }
    .custom-select-wrap.open .custom-select-menu {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition-delay: 0s;
    }
    .custom-select-option {
      display: flex;
      width: 100%;
      min-height: 36px;
      align-items: center;
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--subtle);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      text-align: left;
      transition: background-color .16s ease, color .16s ease;
    }
    .custom-select-option:hover, .custom-select-option:focus-visible, .custom-select-option[aria-selected="true"] {
      outline: none;
      background: color-mix(in srgb, var(--foreground) 9%, var(--panel));
      color: var(--foreground);
    }
    .settings-panel .setting-description {
      margin: 0;
      padding: 12px 0 10px;
      border-top: 1px solid color-mix(in srgb, var(--edge) 72%, transparent);
      color: var(--subtle);
      font-size: 12px;
      line-height: 1.55;
    }
    .clock-scale-row { display: flex; align-items: center; justify-content: flex-end; width: min(260px, 55%); }
    .format-toggle {
      position: relative;
      display: grid;
      width: min(220px, 52%);
      grid-template-columns: repeat(2, minmax(0, 1fr));
      padding: 3px;
      border: 1px solid var(--edge);
      border-radius: 9px;
      background: color-mix(in srgb, var(--panel) 68%, var(--page));
      isolation: isolate;
    }
    .format-toggle button {
      position: relative;
      z-index: 1;
      overflow: hidden;
      isolation: isolate;
      min-height: 34px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--subtle);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      transition: color .2s ease;
    }
    .format-toggle button::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        circle at var(--spot-x, 50%) var(--spot-y, 50%),
        color-mix(in srgb, var(--foreground) 10%, var(--page)),
        color-mix(in srgb, var(--foreground) 5%, var(--page)) 42%,
        transparent 74%
      );
      content: "";
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }
    .format-toggle button:hover::before { opacity: 1; }
    .format-toggle button[aria-pressed="true"] { color: var(--foreground); }
    .format-toggle button:focus-visible { outline: 2px solid var(--theme-accent); outline-offset: 2px; }
    .format-setting {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--subtle);
      font-size: 13px;
    }
    .format-indicator {
      position: absolute;
      z-index: 0;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      border-radius: 7px;
      background: var(--segment-active);
      box-shadow: inset 0 1px #ffffff12, 0 2px 8px #0001;
      transition: transform 300ms cubic-bezier(.22, 1, .36, 1), background-color 240ms ease;
      pointer-events: none;
    }
    .editor-error { min-height: 20px; margin-top: 7px; color: #ef7777; font-size: 13px; }
    .status-message {
      position: fixed;
      z-index: 20;
      right: 16px;
      bottom: 16px;
      max-width: min(360px, calc(100vw - 32px));
      padding: 10px 14px;
      border: 1px solid var(--edge);
      border-radius: 7px;
      background: var(--panel);
      color: var(--foreground);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .status-message.visible { opacity: 1; transform: translateY(0); }
    html.fullscreen-mode .status-message { display: none; }

    .screensaver {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      overflow: hidden;
      background: var(--page);
      background-image: var(--ambient-bg);
    }
    .screensaver.active { display: block; cursor: none; }
    .screensaver-clock {
      position: absolute;
      margin: 0;
      filter: none;
      transform-origin: top left;
      will-change: transform;
    }
    .screensaver .meridiem { opacity: 0 !important; visibility: hidden !important; }
    .screensaver.active ~ .status-message { display: none; }
    html[data-theme^="custom-"] .digit {
      box-shadow: inset 1px 0 #ffffff10, inset -1px 0 #0005, 0 2px 3px #0004, 0 12px 26px #0005,
        0 0 var(--custom-glow) color-mix(in srgb, var(--theme-accent) 48%, transparent);
    }
    html[data-theme^="custom-"] .digit::after { background: var(--seam); }
    html[data-theme^="custom-"] .control-button.primary {
      border-color: var(--theme-accent);
      background: var(--theme-accent);
      color: var(--page);
    }

    .theme-wipe-edge {
      position: fixed;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: -2px;
      width: 2px;
      opacity: 0;
      background: linear-gradient(180deg, transparent, var(--theme-accent) 10%, #fff 50%, var(--theme-accent) 90%, transparent);
      box-shadow: 0 0 10px var(--theme-accent), 0 0 24px var(--theme-accent);
      pointer-events: none;
      view-transition-name: none;
    }

    html[data-theme="dracula"] .control-button.primary,
    html[data-theme="tokyo-night"] .control-button.primary,
    html[data-theme="nord"] .control-button.primary,
    html[data-theme="gruvbox"] .control-button.primary,
    html[data-theme="catppuccin-mocha"] .control-button.primary,
    html[data-theme="solarized-dark"] .control-button.primary,
    html[data-theme="monokai"] .control-button.primary,
    html[data-theme="rose-pine"] .control-button.primary,
    html[data-theme="everforest"] .control-button.primary,
    html[data-theme="amber-terminal"] .control-button.primary {
      border-color: var(--theme-accent);
      background: var(--theme-accent);
      color: var(--page);
    }

    html[data-theme="dracula"] .mode-indicator,
    html[data-theme="tokyo-night"] .mode-indicator,
    html[data-theme="nord"] .mode-indicator,
    html[data-theme="gruvbox"] .mode-indicator,
    html[data-theme="catppuccin-mocha"] .mode-indicator,
    html[data-theme="solarized-dark"] .mode-indicator,
    html[data-theme="monokai"] .mode-indicator,
    html[data-theme="rose-pine"] .mode-indicator,
    html[data-theme="everforest"] .mode-indicator,
    html[data-theme="amber-terminal"] .mode-indicator {
      box-shadow: inset 0 1px #ffffff18, 0 2px 12px color-mix(in srgb, var(--theme-accent) 15%, transparent);
    }

  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="jiKAN">
        <span>jiKAN</span><small>時計</small>
      </div>
      <div class="topbar-actions">
        <div class="theme-switcher" role="group" aria-label="Color theme">
          <button class="theme-arrow" type="button" data-theme-step="-1" aria-label="Previous theme">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 4-6 6 6 6"/></svg>
          </button>
          <div class="theme-current" aria-live="polite">
            <span class="theme-name" id="theme-name">Obsidian</span>
            <span class="theme-count" id="theme-count">01 / 14</span>
          </div>
          <button class="theme-arrow" type="button" data-theme-step="1" aria-label="Next theme">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 4 6 6-6 6"/></svg>
          </button>
        </div>
        <button class="control-button icon-button settings-toggle" type="button" data-action="theme-editor" aria-label="Open settings" aria-expanded="false" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"/>
            <circle cx="9" cy="6" r="2" fill="var(--page)"/>
            <circle cx="15" cy="12" r="2" fill="var(--page)"/>
            <circle cx="8" cy="18" r="2" fill="var(--page)"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="workspace" aria-label="Flip clock">
      <nav class="mode-tabs" aria-label="Clock mode">
        <span class="mode-indicator" aria-hidden="true"></span>
        <button class="mode-tab" type="button" data-mode="clock" aria-pressed="true">Clock</button>
        <button class="mode-tab" type="button" data-mode="timer" aria-pressed="false">Timer</button>
        <button class="mode-tab" type="button" data-mode="pomodoro" aria-pressed="false">Pomodoro</button>
      </nav>

      <div class="clock-stage">
        <div class="mode-caption" id="mode-caption">Local time</div>
        <div class="clock-display" id="clock-display" role="timer" aria-label="Current time">
          <span class="meridiem" id="meridiem" aria-hidden="true"></span>
        </div>
      </div>

      <div class="control-panel" id="control-panel"></div>
    </section>

  </main>
  <div class="theme-wipe-edge" aria-hidden="true"></div>
  <div class="screensaver" id="screensaver" aria-label="Bouncing screensaver"></div>
  <dialog class="theme-editor" id="theme-editor" aria-labelledby="editor-title">
    <div class="editor-content">
      <div class="editor-heading">
        <div>
          <h2 id="editor-title">jiKAN settings</h2>
          <p>Make the clock yours. Your preferences stay on this device.</p>
        </div>
        <button class="control-button editor-close" type="button" data-action="close-editor" aria-label="Close theme editor">×</button>
      </div>
      <div class="settings-tabs" role="tablist" aria-label="Settings sections">
        <span class="settings-indicator" aria-hidden="true"></span>
        <button class="settings-tab" id="themes-tab" type="button" role="tab" aria-selected="true" aria-controls="themes-panel" data-settings-tab="themes">Themes</button>
        <button class="settings-tab" id="settings-tab" type="button" role="tab" aria-selected="false" aria-controls="settings-panel" data-settings-tab="settings">Settings</button>
      </div>
      <section class="settings-panel editor-section" id="themes-panel" role="tabpanel" aria-labelledby="themes-tab" data-settings-panel="themes">
        <h3>Custom themes</h3>
        <div class="theme-form">
          <label class="name-field" for="managed-theme">Edit theme
            <select id="managed-theme"><option value="">Create a new theme</option></select>
          </label>
          <label class="name-field" for="theme-name-input">Theme name
            <input id="theme-name-input" type="text" maxlength="32" required placeholder="My theme">
          </label>
          <label for="theme-page">Background<input id="theme-page" type="color" data-color-prop="page"></label>
          <label for="theme-foreground">Text<input id="theme-foreground" type="color" data-color-prop="foreground"></label>
          <label for="theme-subtle">Secondary text<input id="theme-subtle" type="color" data-color-prop="subtle"></label>
          <label for="theme-edge">Borders<input id="theme-edge" type="color" data-color-prop="edge"></label>
          <label for="theme-accent">Accent<input id="theme-accent" type="color" data-color-prop="accent"></label>
          <label for="theme-panel">Controls<input id="theme-panel" type="color" data-color-prop="panel"></label>
          <label for="theme-card">Card highlight<input id="theme-card" type="color" data-color-prop="card"></label>
          <label for="theme-card-alt">Card shade<input id="theme-card-alt" type="color" data-color-prop="cardAlt"></label>
          <label for="theme-face">Flip highlight<input id="theme-face" type="color" data-color-prop="face"></label>
          <label for="theme-face-alt">Flip shade<input id="theme-face-alt" type="color" data-color-prop="faceAlt"></label>
          <label for="theme-digit">Digit color<input id="theme-digit" type="color" data-color-prop="digit"></label>
          <label for="theme-seam">Flip seam<input id="theme-seam" type="color" data-color-prop="seam"></label>
          <label class="glow-field" for="theme-glow">Accent glow
            <input id="theme-glow" type="range" min="0" max="40" step="0.1" value="0">
          </label>
          <label class="glow-field" for="theme-ambient">Ambient background glow
            <input id="theme-ambient" type="checkbox">
          </label>
        </div>
        <div class="editor-actions">
          <button class="control-button" type="button" data-action="new-theme">New</button>
          <button class="control-button" type="button" data-action="duplicate-theme">Duplicate</button>
          <button class="control-button danger" type="button" data-action="delete-theme">Delete</button>
          <span class="spacer"></span>
          <button class="control-button primary" type="button" data-action="save-theme">Save &amp; use</button>
        </div>
        <div class="editor-error" id="editor-error" role="status" aria-live="polite"></div>
      </section>
      <section class="settings-panel editor-section" id="settings-panel" role="tabpanel" aria-labelledby="settings-tab" data-settings-panel="settings" hidden>
        <h3>Display</h3>
        <div class="saver-settings">
          <label for="clock-scale">Clock size
            <span class="clock-scale-row">
              <input id="clock-scale" type="range" min="70" max="120" step="0.1" value="120">
            </span>
          </label>
          <div class="format-setting">
            <span class="format-label">Clock format</span>
            <div class="format-toggle" role="group" aria-label="Clock format">
              <span class="format-indicator" aria-hidden="true"></span>
              <button type="button" data-hour-format="24" aria-pressed="true">24-hour</button>
              <button type="button" data-hour-format="12" aria-pressed="false">12-hour</button>
            </div>
          </div>
        </div>
        <section class="editor-section" aria-label="Screensaver settings">
          <h3>Screensaver</h3>
          <div class="saver-settings">
            <label for="screensaver-delay">Start after inactivity
              <select id="screensaver-delay">
                <option value="0">Off</option>
                <option value="60000">1 minute</option>
                <option value="120000">2 minutes</option>
                <option value="300000">5 minutes</option>
                <option value="600000">10 minutes</option>
                <option value="900000">15 minutes</option>
              </select>
            </label>
            <p class="setting-description">The screensaver shows the current clock or timer. Press Escape or move the pointer to exit.</p>
          </div>
        </section>
      </section>
    </div>
  </dialog>
  <div class="status-message" id="status-message" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const display = document.getElementById("clock-display");
      const caption = document.getElementById("mode-caption");
      const panel = document.getElementById("control-panel");
      const workspace = document.querySelector(".workspace");
      const modeTabs = document.querySelector(".mode-tabs");
      const appShell = document.querySelector(".app-shell");
      const topbar = document.querySelector(".topbar");
      const themeSwitcher = document.querySelector(".theme-switcher");
      const themeName = document.getElementById("theme-name");
      const themeCount = document.getElementById("theme-count");
      const themeWipeEdge = document.querySelector(".theme-wipe-edge");
      const modeIndicator = document.querySelector(".mode-indicator");
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const modeButtons = [...document.querySelectorAll(".mode-tab")];
      const screensaver = document.getElementById("screensaver");
      const themeEditor = document.getElementById("theme-editor");
      const settingsToggle = document.querySelector(".settings-toggle");
      const settingsTabs = [...document.querySelectorAll("[data-settings-tab]")];
      const settingsIndicator = document.querySelector(".settings-indicator");
      const settingsPanels = [...document.querySelectorAll("[data-settings-panel]")];
      const managedTheme = document.getElementById("managed-theme");
      const customSelects = new Map();
      const editorName = document.getElementById("theme-name-input");
      const editorError = document.getElementById("editor-error");
      const screensaverDelay = document.getElementById("screensaver-delay");
      const hourFormatButtons = [...document.querySelectorAll("[data-hour-format]")];
      const formatIndicator = document.querySelector(".format-indicator");
      const clockScaleControl = document.getElementById("clock-scale");
      const meridiem = document.getElementById("meridiem");
      const statusMessage = document.getElementById("status-message");
      let statusTimer = 0;
      let settingsCloseTimer = 0;

      function announce(message) {
        statusMessage.textContent = message;
        statusMessage.classList.add("visible");
        window.clearTimeout(statusTimer);
        statusTimer = window.setTimeout(() => statusMessage.classList.remove("visible"), 3200);
      }

      function validHex(value) {
        return typeof value === "string" && /^#[\da-f]{6}$/i.test(value);
      }

      function validCustomTheme(theme) {
        return theme && typeof theme === "object" &&
          /^custom-[\da-z-]{1,48}$/.test(theme.id) &&
          typeof theme.name === "string" && theme.name.trim().length > 0 && theme.name.length <= 32 &&
          ["page", "foreground", "subtle", "edge", "panel", "card", "cardAlt", "face", "faceAlt", "digit", "seam", "accent"].every(key => validHex(theme[key])) &&
          Number.isFinite(theme.glow) && theme.glow >= 0 && theme.glow <= 40 && typeof theme.ambient === "boolean";
      }

      function loadCustomThemes() {
        try {
          const raw = localStorage.getItem("hour.custom-themes");
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) throw new TypeError("Saved themes must be a list.");
          const themes = parsed.filter(validCustomTheme);
          if (themes.length !== parsed.length) announce("Some saved themes were invalid and were skipped.");
          return themes;
        } catch (error) {
          if (error instanceof SyntaxError || error instanceof TypeError) {
            announce("Saved themes could not be read. You can create new themes in the editor.");
            return [];
          }
          announce("Browser storage is unavailable; custom themes may not persist.");
          return [];
        }
      }

      function loadSettings() {
        const defaults = {
          themeId: "amber-terminal",
          saverDelay: 0,
          hourFormat: "24",
          clockScale: 120,
          timerConfig: { hours: 0, minutes: 25, seconds: 0 },
          pomConfig: { work: 25, short: 5, long: 15 }
        };
        try {
          const raw = localStorage.getItem("hour.settings");
          if (!raw) return defaults;
          const stored = JSON.parse(raw);
          if (!stored || typeof stored !== "object") throw new TypeError("Saved settings are invalid.");
          const parseConfig = (candidate, keys, max, minimum) => {
            const result = {};
            for (const key of keys) {
              const value = Number(candidate?.[key]);
              result[key] = Number.isInteger(value) ? Math.min(max[key], Math.max(minimum[key], value)) : defaults[key === "hours" || key === "minutes" || key === "seconds" ? "timerConfig" : "pomConfig"][key];
            }
            return result;
          };
          return {
            themeId: typeof stored.themeId === "string" ? stored.themeId : defaults.themeId,
            saverDelay: [0, 60000, 120000, 300000, 600000, 900000].includes(stored.saverDelay) ? stored.saverDelay : 0,
            hourFormat: stored.hourFormat === "12" ? "12" : "24",
            clockScale: Number.isFinite(stored.clockScale) ? Math.min(120, Math.max(70, stored.clockScale)) : defaults.clockScale,
            timerConfig: parseConfig(stored.timerConfig, ["hours", "minutes", "seconds"], { hours: 99, minutes: 59, seconds: 59 }, { hours: 0, minutes: 0, seconds: 0 }),
            pomConfig: parseConfig(stored.pomConfig, ["work", "short", "long"], { work: 180, short: 60, long: 90 }, { work: 1, short: 1, long: 1 })
          };
        } catch {
          announce("Saved settings could not be read; default settings are in use.");
          return defaults;
        }
      }

      const storedThemes = loadCustomThemes();
      const savedSettings = loadSettings();
      const themes = [
        { id: "amber-terminal", name: "Amber Terminal", color: "#17130b", accent: "#ffbb33", scheme: "dark" },
        { id: "light", name: "Light", color: "#e9eef5", accent: "#556b88", scheme: "light" },
        { id: "catppuccin-mocha", name: "Catppuccin Mocha", color: "#1e1e2e", accent: "#cba6f7", scheme: "dark" },
        { id: "catppuccin-latte", name: "Catppuccin Latte", color: "#eff1f5", accent: "#8839ef", scheme: "light" },
        { id: "gruvbox", name: "Gruvbox", color: "#282828", accent: "#fabd2f", scheme: "dark" },
        { id: "nord", name: "Nord", color: "#2e3440", accent: "#88c0d0", scheme: "dark" },
        { id: "dracula", name: "Dracula", color: "#282a36", accent: "#bd93f9", scheme: "dark" },
        { id: "tokyo-night", name: "Tokyo Night", color: "#1a1b26", accent: "#7aa2f7", scheme: "dark" },
        { id: "solarized-dark", name: "Solarized Dark", color: "#002b36", accent: "#2aa198", scheme: "dark" },
        { id: "solarized-light", name: "Solarized Light", color: "#fdf6e3", accent: "#268bd2", scheme: "light" },
        { id: "monokai", name: "Monokai", color: "#2d2a2e", accent: "#ff6188", scheme: "dark" },
        { id: "rose-pine", name: "Rosé Pine", color: "#191724", accent: "#ebbcba", scheme: "dark" },
        { id: "everforest", name: "Everforest", color: "#2d353b", accent: "#a7c080", scheme: "dark" },
        { id: "obsidian", name: "Obsidian", color: "#000000", accent: "#dedbd2", scheme: "dark" }
      ];
      themes.push(...storedThemes.map(toCarouselTheme));
      const state = {
        mode: "clock",
        timerConfig: savedSettings.timerConfig,
        pomConfig: savedSettings.pomConfig,
        timerRemaining: savedSettings.timerConfig.hours * 3600 + savedSettings.timerConfig.minutes * 60 + savedSettings.timerConfig.seconds,
        timerDeadline: null,
        pomRemaining: savedSettings.pomConfig.work * 60,
        pomDeadline: null,
        pomPhase: "Work",
        workSessions: 0,
        fullscreen: false,
        themeIndex: Math.max(0, themes.findIndex(theme => theme.id === savedSettings.themeId)),
        themeSwitching: false,
        screensaver: false,
        saverDelay: savedSettings.saverDelay,
        hourFormat: savedSettings.hourFormat,
        clockScale: savedSettings.clockScale
      };

      const safeInt = (input, fallback = 0) => {
        const value = Number.parseInt(input.value, 10);
        return Number.isFinite(value) ? Math.max(0, value) : fallback;
      };

      const colorProperties = ["page", "foreground", "subtle", "edge", "panel", "card", "cardAlt", "face", "faceAlt", "digit", "seam", "accent"];
      const cssProperties = ["--page", "--foreground", "--subtle", "--edge", "--panel", "--digit-bg", "--face-bg", "--digit-ink", "--seam", "--theme-accent", "--custom-glow", "--ambient-bg"];

      function toCarouselTheme(theme) {
        const red = Number.parseInt(theme.page.slice(1, 3), 16);
        const green = Number.parseInt(theme.page.slice(3, 5), 16);
        const blue = Number.parseInt(theme.page.slice(5, 7), 16);
        return { ...theme, color: theme.page, scheme: red * 0.299 + green * 0.587 + blue * 0.114 > 150 ? "light" : "dark", custom: true };
      }

      function persistSettings() {
        try {
          localStorage.setItem("hour.settings", JSON.stringify({
            themeId: themes[state.themeIndex]?.id || "amber-terminal",
            saverDelay: state.saverDelay,
            hourFormat: state.hourFormat,
            clockScale: state.clockScale,
            timerConfig: state.timerConfig,
            pomConfig: state.pomConfig
          }));
        } catch {
          announce("Browser storage is unavailable; your settings could not be saved.");
        }
      }

      function persistCustomThemes() {
        try {
          const custom = themes.filter(theme => theme.custom).map(theme => {
            const saved = { id: theme.id, name: theme.name, glow: theme.glow, ambient: theme.ambient };
            for (const key of colorProperties) saved[key] = theme[key];
            return saved;
          });
          localStorage.setItem("hour.custom-themes", JSON.stringify(custom));
          return true;
        } catch {
          announce("Browser storage is unavailable; your custom theme could not be saved.");
          return false;
        }
      }

      function applyClockScale() {
        const compact = window.innerWidth <= 760;
        const workspaceStyle = getComputedStyle(workspace);
        const shellStyle = getComputedStyle(appShell);
        const captionStyle = getComputedStyle(caption);
        const tabsHeight = modeTabs.getBoundingClientRect().height;
        const panelHeight = panel.getBoundingClientRect().height;
        const captionHeight = caption.getBoundingClientRect().height;
        const gapCount = Number(tabsHeight > 0) + Number(panelHeight > 0);
        const availableWorkspaceHeight = Math.min(
          workspace.clientHeight,
          window.innerHeight - topbar.getBoundingClientRect().height -
            parseFloat(shellStyle.paddingTop) - parseFloat(shellStyle.paddingBottom)
        );
        const availableDisplayHeight = Math.max(0,
          availableWorkspaceHeight - parseFloat(workspaceStyle.paddingTop) - parseFloat(workspaceStyle.paddingBottom) -
            tabsHeight - panelHeight - parseFloat(workspaceStyle.rowGap) * gapCount -
          captionHeight - (captionHeight ? parseFloat(captionStyle.marginBottom) : 0) - 4
        );
        const availableDisplayWidth = window.innerWidth - parseFloat(shellStyle.paddingLeft) - parseFloat(shellStyle.paddingRight) - 32;
        const digitGroupGap = parseFloat(getComputedStyle(display.querySelector(".digit-group")).columnGap);
        const displayGap = parseFloat(getComputedStyle(display).columnGap);
        const separatorWidth = [...display.querySelectorAll(".separator")]
          .reduce((width, separator) => width + separator.getBoundingClientRect().width, 0);
        const flexItemCount = display.querySelectorAll(".digit-group, .separator").length;
        const fixedDisplayWidth = separatorWidth + (flexItemCount - 1) * displayGap + 3 * digitGroupGap;
        const maxBaseByWidth = Math.max(32, (availableDisplayWidth - fixedDisplayWidth) / (3.48 * 1.2));
        const maxBaseByHeight = Math.max(32, availableDisplayHeight / (1.16 * 1.2));
        const baseSize = Math.min(
          window.innerWidth * (compact ? 0.18 : 0.22),
          window.innerHeight * 0.34,
          compact ? 160 : 352,
          maxBaseByWidth,
          maxBaseByHeight
        );
        const fontSize = baseSize * state.clockScale / 100;
        document.documentElement.style.setProperty("--clock-font-size", `${fontSize}px`);
        clockScaleControl.value = String(state.clockScale);
        updateRangeTrack(clockScaleControl);
      }

      function updateRangeTrack(input) {
        const min = Number(input.min) || 0;
        const max = Number(input.max) || 100;
        const value = Number(input.value);
        const progress = max > min ? ((value - min) / (max - min)) * 100 : 0;
        input.style.setProperty("--range-progress", `${Math.min(100, Math.max(0, progress))}%`);
      }

      function setCustomThemeStyle(theme) {
        const root = document.documentElement;
        for (const property of cssProperties) root.style.removeProperty(property);
        if (!theme.custom) return;
        const red = Number.parseInt(theme.accent.slice(1, 3), 16);
        const green = Number.parseInt(theme.accent.slice(3, 5), 16);
        const blue = Number.parseInt(theme.accent.slice(5, 7), 16);
        const properties = {
          "--page": theme.page,
          "--foreground": theme.foreground,
          "--subtle": theme.subtle,
          "--edge": theme.edge,
          "--panel": theme.panel,
          "--digit-bg": `linear-gradient(110deg, ${theme.card}, ${theme.cardAlt} 54%, ${theme.card})`,
          "--face-bg": `linear-gradient(105deg, ${theme.face}, ${theme.faceAlt} 55%, ${theme.face})`,
          "--digit-ink": theme.digit,
          "--seam": theme.seam,
          "--theme-accent": theme.accent,
          "--custom-glow": `${theme.glow}px`,
          "--ambient-bg": theme.ambient
            ? `radial-gradient(ellipse at 12% 80%, rgba(${red}, ${green}, ${blue}, .09), transparent 42%), radial-gradient(ellipse at 88% 18%, rgba(${red}, ${green}, ${blue}, .06), transparent 38%)`
            : "none"
        };
        for (const [property, value] of Object.entries(properties)) root.style.setProperty(property, value);
      }

      function updateThemeMeta() {
        const theme = themes[state.themeIndex];
        themeName.textContent = theme.name;
        themeCount.textContent = `${String(state.themeIndex + 1).padStart(2, "0")} / ${String(themes.length).padStart(2, "0")}`;
      }

      function firstColor(value, fallback) {
        const color = String(value).match(/#[\da-f]{6}/i)?.[0];
        return color || fallback;
      }

      function secondColor(value, fallback) {
        const colors = String(value).match(/#[\da-f]{6}/ig);
        return colors?.[1] || colors?.[0] || fallback;
      }

      function currentPalette() {
        const style = getComputedStyle(document.documentElement);
        const defaults = {
          page: "#202020", foreground: "#eeeeee", subtle: "#999999", edge: "#444444",
          panel: "#303030", card: "#282828", cardAlt: "#181818", face: "#333333",
          faceAlt: "#222222", digit: "#eeeeee", seam: "#101010", accent: "#b9a6ff"
        };
        const variables = {
          page: "--page", foreground: "--foreground", subtle: "--subtle", edge: "--edge", panel: "--panel",
          card: "--digit-bg", face: "--face-bg", digit: "--digit-ink", seam: "--seam", accent: "--theme-accent"
        };
        const palette = Object.fromEntries(Object.entries(variables).map(([key, property]) =>
          [key, firstColor(style.getPropertyValue(property), defaults[key])]));
        palette.cardAlt = secondColor(style.getPropertyValue("--digit-bg"), defaults.cardAlt);
        palette.faceAlt = secondColor(style.getPropertyValue("--face-bg"), defaults.faceAlt);
        palette.ambient = style.getPropertyValue("--ambient-bg").trim() !== "none";
        return palette;
      }

      function fillThemeEditor(theme, name = "My Theme") {
        editorName.value = theme?.name || name;
        const palette = theme || currentPalette();
        for (const input of document.querySelectorAll("[data-color-prop]")) {
          input.value = validHex(palette[input.dataset.colorProp]) ? palette[input.dataset.colorProp] : "#777777";
        }
        document.getElementById("theme-glow").value = String(theme?.glow ?? 0);
        updateRangeTrack(document.getElementById("theme-glow"));
        document.getElementById("theme-ambient").checked = Boolean(theme?.ambient ?? palette.ambient);
        editorError.textContent = "";
      }

      function syncCustomSelect(select) {
        const custom = customSelects.get(select);
        if (!custom) return;
        const selected = select.selectedOptions[0];
        custom.value.textContent = selected?.textContent || "";
        custom.menu.replaceChildren();
        [...select.options].forEach((option, index) => {
          const item = document.createElement("div");
          item.className = "custom-select-option";
          item.id = `${select.id}-option-${index}`;
          item.setAttribute("role", "option");
          item.setAttribute("aria-selected", String(option.selected));
          item.setAttribute("aria-disabled", String(option.disabled));
          item.tabIndex = option.disabled ? -1 : 0;
          item.textContent = option.textContent;
          item.addEventListener("click", () => {
            if (option.disabled) return;
            select.value = option.value;
            select.dispatchEvent(new Event("change", { bubbles: true }));
            syncCustomSelect(select);
            closeCustomSelect(custom.wrap);
            custom.trigger.focus();
          });
          item.addEventListener("keydown", event => {
            const available = [...custom.menu.querySelectorAll('[role="option"]:not([aria-disabled="true"])')];
            const currentIndex = available.indexOf(item);
            let nextIndex = currentIndex;
            if (event.key === "ArrowDown") nextIndex = (currentIndex + 1) % available.length;
            else if (event.key === "ArrowUp") nextIndex = (currentIndex - 1 + available.length) % available.length;
            else if (event.key === "Home") nextIndex = 0;
            else if (event.key === "End") nextIndex = available.length - 1;
            else if (event.key === "Escape") {
              event.preventDefault();
              event.stopPropagation();
              closeCustomSelect(custom.wrap);
              custom.trigger.focus();
              return;
            } else if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              item.click();
              return;
            } else return;
            event.preventDefault();
            available[nextIndex]?.focus();
          });
          custom.menu.append(item);
        });
      }

      function closeCustomSelect(wrap, returnFocus = false) {
        const custom = [...customSelects.values()].find(item => item.wrap === wrap);
        if (!custom) return;
        wrap.classList.remove("open");
        custom.trigger.setAttribute("aria-expanded", "false");
        if (returnFocus) custom.trigger.focus();
      }

      function openCustomSelect(custom) {
        customSelects.forEach(other => {
          if (other !== custom) closeCustomSelect(other.wrap);
        });
        custom.wrap.classList.add("open");
        custom.trigger.setAttribute("aria-expanded", "true");
        const selected = custom.menu.querySelector('[aria-selected="true"]:not([aria-disabled="true"])');
        (selected || custom.menu.querySelector('[role="option"]:not([aria-disabled="true"])'))?.focus();
      }

      function enhanceCustomSelect(select) {
        const wrap = document.createElement("span");
        wrap.className = "custom-select-wrap";
        const label = select.closest("label")?.firstChild?.textContent?.trim() || "Choose an option";
        const trigger = document.createElement("button");
        trigger.className = "custom-select-trigger";
        trigger.type = "button";
        trigger.setAttribute("aria-label", label);
        trigger.setAttribute("aria-haspopup", "listbox");
        trigger.setAttribute("aria-expanded", "false");
        const value = document.createElement("span");
        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        arrow.setAttribute("viewBox", "0 0 16 16");
        arrow.setAttribute("aria-hidden", "true");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "m3 6 5 5 5-5");
        arrow.append(path);
        trigger.append(value, arrow);
        const menu = document.createElement("div");
        menu.className = "custom-select-menu";
        menu.id = `${select.id}-menu`;
        menu.setAttribute("role", "listbox");
        trigger.setAttribute("aria-controls", menu.id);
        select.before(wrap);
        wrap.append(trigger, menu, select);
        const custom = { wrap, trigger, menu, value };
        customSelects.set(select, custom);
        trigger.addEventListener("click", () => {
          wrap.classList.contains("open") ? closeCustomSelect(wrap) : openCustomSelect(custom);
        });
        trigger.addEventListener("keydown", event => {
          if (event.key === "ArrowDown" || event.key === "ArrowUp" || event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openCustomSelect(custom);
          } else if (event.key === "Escape" && wrap.classList.contains("open")) {
            event.preventDefault();
            event.stopPropagation();
            closeCustomSelect(wrap);
          }
        });
        syncCustomSelect(select);
      }

      function refreshManagedThemes(selectedId = "") {
        managedTheme.replaceChildren(new Option("Create a new theme", ""));
        for (const theme of themes.filter(candidate => candidate.custom)) {
          managedTheme.add(new Option(theme.name, theme.id));
        }
        managedTheme.value = selectedId;
        syncCustomSelect(managedTheme);
      }

      function readThemeEditor(id = "") {
        const name = editorName.value.trim();
        if (!name || name.length > 32) throw new Error("Enter a theme name of 1–32 characters.");
        const theme = {
          id: id || `custom-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`,
          name,
          glow: Number(document.getElementById("theme-glow").value),
          ambient: document.getElementById("theme-ambient").checked
        };
        for (const input of document.querySelectorAll("[data-color-prop]")) theme[input.dataset.colorProp] = input.value.toLowerCase();
        const invalidColors = colorProperties.filter(key => !validHex(theme[key]));
        if (invalidColors.length) throw new Error(`Choose a valid color for: ${invalidColors.join(", ")}.`);
        if (!Number.isFinite(theme.glow) || theme.glow < 0 || theme.glow > 40) {
          throw new Error("Accent glow must be between 0 and 40.");
        }
        if (!validCustomTheme(theme)) throw new Error("Check the theme name and settings.");
        return theme;
      }

      function bindDigit(digit) {
        digit.querySelector(".flap-bottom").addEventListener("animationend", event => {
          if (event.animationName !== "flip-in") return;
          const next = digit.dataset.target;
          const lower = digit.querySelector(".half.lower span");
          lower.textContent = next;
          digit.dataset.value = next;
          digit.classList.remove("flipping");
        });
      }

      function makeDigit() {
        const digit = document.createElement("div");
        digit.className = "digit";
        digit.innerHTML = '<div class="half upper"><span></span></div><div class="half lower"><span></span></div><div class="flap flap-top"><span></span></div><div class="flap flap-bottom"><span></span></div>';
        bindDigit(digit);
        return digit;
      }

      const groups = [];
      for (let groupIndex = 0; groupIndex < 3; groupIndex++) {
        const group = document.createElement("div");
        group.className = "digit-group";
        const digits = [makeDigit(), makeDigit()];
        digits.forEach(digit => group.append(digit));
        groups.push(digits);
        display.append(group);
      }
      function finishFlip(digit) {
        const next = digit.dataset.target;
        const [upper, lower] = digit.querySelectorAll(".half span");
        upper.textContent = next;
        lower.textContent = next;
        digit.dataset.value = next;
        digit.classList.remove("flipping");
      }

      function paintDigit(digit, value) {
        if (digit.classList.contains("flipping")) {
          if (digit.dataset.target === value) return;
          finishFlip(digit);
        }
        const [upper, lower, top, bottom] = digit.querySelectorAll("span");
        const old = digit.dataset.value || "";
        if (old === value) return;
        digit.dataset.target = value;
        if (!old) {
          upper.textContent = value;
          lower.textContent = value;
          digit.dataset.value = value;
          return;
        }
        top.textContent = old || value;
        upper.textContent = value;
        bottom.textContent = value;
        digit.classList.add("flipping");
      }

      function renderDigits(totalSeconds, isClock = false) {
        const time = Math.max(0, Math.floor(totalSeconds));
        const actualHours = Math.floor(time / 3600) % 24;
        const hours = isClock && state.hourFormat === "12" ? (actualHours % 12 || 12) : isClock ? actualHours : Math.floor(time / 3600) % 100;
        const minutes = Math.floor(time / 60) % 60;
        const seconds = time % 60;
        meridiem.textContent = actualHours < 12 ? "AM" : "PM";
        display.classList.toggle("has-meridiem", isClock && state.hourFormat === "12");
        const values = `${String(hours).padStart(2, "0")}${String(minutes).padStart(2, "0")}${String(seconds).padStart(2, "0")}`;
        for (let index = 0; index < 6; index++) {
          const value = values[index];
          paintDigit(groups[Math.floor(index / 2)][index % 2], value);
        }
      }

      function fields(items) {
        return `<div class="duration-settings">${items.map(({ key, label, value, min = 0, max }) => `
          <label class="duration-field"><span class="duration-input-wrap">
            <input type="number" inputmode="numeric" min="${min}" max="${max}" step="1" value="${value}" data-duration="${key}" aria-label="${label}">
            <span class="duration-stepper">
              <button type="button" data-duration-step="1" aria-label="Increase ${label}"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2 8 4-4 4 4"/></svg></button>
              <button type="button" data-duration-step="-1" aria-label="Decrease ${label}"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2 4 4 4 4-4"/></svg></button>
            </span>
          </span>${label}</label>
        `).join("")}</div>`;
      }

      function controls() {
        const fullscreenButton = `<button class="control-button icon-button" type="button" data-action="fullscreen" aria-label="Enter fullscreen" title="Fullscreen (F)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg><span>Fullscreen</span>
        </button>`;
        const screensaverButton = `<button class="control-button icon-button" type="button" data-action="screensaver" aria-label="Start screensaver" title="Screensaver">
          <svg class="dvd-icon" viewBox="0 0 48 32" aria-hidden="true">
            <text x="24" y="19" fill="currentColor" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="-1" text-anchor="middle">DVD</text>
            <ellipse cx="24" cy="26" rx="18" ry="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg><span>Screensaver</span>
        </button>`;
        if (state.mode === "clock") {
          panel.innerHTML = `<div class="control-group mode-actions">${screensaverButton}${fullscreenButton}</div>`;
          caption.textContent = "Local time";
          display.setAttribute("aria-label", "Current local time");
          return;
        }
        const active = state.mode === "timer" ? state.timerDeadline !== null : state.pomDeadline !== null;
        const pauseLabel = active ? "Pause" : "Start";
        const resetLabel = "Reset";
        let settings = "";
        if (state.mode === "timer") {
          settings = fields([
            { key: "hours", label: "h", value: state.timerConfig.hours, max: 99 },
            { key: "minutes", label: "m", value: state.timerConfig.minutes, max: 59 },
            { key: "seconds", label: "s", value: state.timerConfig.seconds, max: 59 }
          ]);
        } else {
          settings = fields([
            { key: "work", label: "work", value: state.pomConfig.work, min: 1, max: 180 },
            { key: "short", label: "short", value: state.pomConfig.short, min: 1, max: 60 },
            { key: "long", label: "long", value: state.pomConfig.long, min: 1, max: 90 }
          ]);
        }
        panel.innerHTML = `<div class="control-stack">
          <div class="control-group mode-actions">
            <button class="control-button primary action-button" type="button" data-action="toggle" title="${pauseLabel} timer (Space)">
              <svg viewBox="0 0 24 24" aria-hidden="true">${active
                ? '<path d="M8 5v14m8-14v14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.4"/>'
                : '<path d="m8 5 12 7-12 7z" fill="currentColor"/>'
              }</svg>
              <span>${pauseLabel}</span>
            </button>
            <button class="control-button action-button" type="button" data-action="reset" title="Reset">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66L4 8.67"/><path d="M4 4v4.67h4.67"/></svg>
              <span>${resetLabel}</span>
            </button>
            ${screensaverButton}
            ${fullscreenButton}
          </div>
          ${settings}
        </div>`;
        for (const input of panel.querySelectorAll("input, .duration-stepper button")) input.disabled = active;
        panel.querySelectorAll("[data-duration]").forEach(syncDurationStepper);
        caption.textContent = state.mode === "timer" ? "Countdown" : `${state.pomPhase} · ${state.pomPhase === "Work" ? `Session ${state.workSessions + 1}` : "Take a breath"}`;
        display.setAttribute("aria-label", state.mode === "timer" ? "Timer countdown" : `${state.pomPhase} countdown`);
      }

      function syncDurationStepper(input) {
        const value = Number(input.value);
        const min = Number(input.min) || 0;
        const max = Number(input.max);
        const buttons = input.closest(".duration-input-wrap")?.querySelectorAll("[data-duration-step]");
        buttons?.forEach(button => {
          const direction = Number(button.dataset.durationStep);
          button.disabled = input.disabled || (direction > 0 ? value >= max : value <= min);
        });
      }

      function durationFromInputs() {
        const { hours, minutes, seconds } = state.timerConfig;
        return hours * 3600 + minutes * 60 + seconds;
      }
