      function currentPomDuration() {
        const key = state.pomPhase === "Work" ? "work" : state.pomPhase === "Short break" ? "short" : "long";
        return state.pomConfig[key] * 60;
      }

      function updateCaption() {
        if (state.mode === "pomodoro") {
          caption.textContent = `${state.pomPhase} · ${state.pomPhase === "Work" ? `Session ${state.workSessions + 1}` : "Take a breath"}`;
          display.setAttribute("aria-label", `${state.pomPhase} countdown`);
        }
      }

      function pauseActiveMode() {
        if (state.mode === "timer" && state.timerDeadline !== null) {
          state.timerRemaining = Math.max(0, Math.ceil((state.timerDeadline - Date.now()) / 1000));
          state.timerDeadline = null;
        }
        if (state.mode === "pomodoro" && state.pomDeadline !== null) {
          state.pomRemaining = Math.max(0, Math.ceil((state.pomDeadline - Date.now()) / 1000));
          state.pomDeadline = null;
        }
      }

      function transitionControls() {
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const duration = milliseconds => reducedMotion ? 1 : milliseconds;
        const outgoingOverlays = [];
        const buttonOffsets = new Map();
        const previousButtons = [...panel.querySelectorAll(".mode-actions [data-action]")];
        const previous = new Map(previousButtons.map(button => [
          button.dataset.action,
          { rect: button.getBoundingClientRect(), clone: button.cloneNode(true) }
        ]));
        const previousSettings = panel.querySelector(".duration-settings");
        const previousSettingsRect = previousSettings?.getBoundingClientRect();
        const previousSettingsClone = previousSettings?.cloneNode(true);
        controls();
        const nextButtons = new Map(
          [...panel.querySelectorAll(".mode-actions [data-action]")].map(button => [button.dataset.action, button])
        );
        const nextSettings = panel.querySelector(".duration-settings");

        for (const [action, item] of previous) {
          if (nextButtons.has(action) || (action !== "toggle" && action !== "reset")) continue;
          const clone = item.clone;
          clone.setAttribute("aria-hidden", "true");
          clone.tabIndex = -1;
          Object.assign(clone.style, {
            position: "fixed",
            left: `${item.rect.left}px`,
            top: `${item.rect.top}px`,
            width: `${item.rect.width}px`,
            height: `${item.rect.height}px`,
            margin: "0",
            zIndex: "30",
            pointerEvents: "none"
          });
          document.body.append(clone);
          outgoingOverlays.push({ element: clone, kind: "button" });
        }

        if (previousSettingsClone && previousSettingsRect) {
          previousSettingsClone.setAttribute("aria-hidden", "true");
          previousSettingsClone.querySelectorAll("input, button").forEach(control => {
            control.disabled = true;
            control.tabIndex = -1;
          });
          Object.assign(previousSettingsClone.style, {
            position: "fixed",
            left: `${previousSettingsRect.left}px`,
            top: `${previousSettingsRect.top}px`,
            width: `${previousSettingsRect.width}px`,
            height: `${previousSettingsRect.height}px`,
            margin: "0",
            zIndex: "30",
            pointerEvents: "none"
          });
          document.body.append(previousSettingsClone);
          outgoingOverlays.push({ element: previousSettingsClone, kind: "settings" });
        }

        for (const [action, button] of nextButtons) {
          const prior = previous.get(action);
          if (prior) {
            const rect = button.getBoundingClientRect();
            const offsetX = prior.rect.left - rect.left;
            const offsetY = prior.rect.top - rect.top;
            if (Math.abs(offsetX) > 1 || Math.abs(offsetY) > 1) {
              buttonOffsets.set(action, { x: offsetX, y: offsetY });
              button.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
              button.style.opacity = ".82";
            }
          } else {
            button.style.opacity = "0";
            button.style.transform = "scale(.96)";
          }
        }
        if (nextSettings) {
          nextSettings.style.opacity = "0";
          nextSettings.style.transform = "scale(.96)";
          nextSettings.style.transformOrigin = "center top";
        }

        requestAnimationFrame(() => {
          for (const [action, button] of nextButtons) {
            const prior = previous.get(action);
            let animation;
            if (prior) {
              const offset = buttonOffsets.get(action);
              if (!offset) continue;
              animation = button.animate([
                { transform: `translate(${offset.x}px, ${offset.y}px)`, opacity: .82 },
                { transform: "translate(0, 0)", opacity: 1 }
              ], { duration: duration(420), easing: "cubic-bezier(.22, 1, .36, 1)" });
            } else {
              animation = button.animate([
                { opacity: 0, transform: "scale(.96)" },
                { opacity: 1, transform: "scale(1)" }
              ], { duration: duration(300), easing: "ease-out" });
            }
            animation.onfinish = () => {
              button.style.removeProperty("opacity");
              button.style.removeProperty("transform");
            };
          }
          for (const overlay of outgoingOverlays) {
            const keyframes = overlay.kind === "settings"
              ? [
                  { opacity: 1, transform: "translateY(0)" },
                  { opacity: 0, transform: "translateY(14px)" }
                ]
              : [
                  { opacity: 1, transform: "translateY(0) scale(1)" },
                  { opacity: 0, transform: "translateY(5px) scale(.97)" }
                ];
            const animation = overlay.element.animate(keyframes, {
              duration: duration(overlay.kind === "settings" ? 300 : 240),
              easing: "ease-in",
              fill: "forwards"
            });
            animation.onfinish = () => overlay.element.remove();
          }
          if (nextSettings) {
            const animation = nextSettings.animate([
              { opacity: 0, transform: "scale(.96)" },
              { opacity: 1, transform: "scale(1)" }
            ], { duration: duration(320), delay: reducedMotion ? 0 : 50, easing: "ease-out" });
            animation.onfinish = () => {
              nextSettings.style.removeProperty("opacity");
              nextSettings.style.removeProperty("transform");
              nextSettings.style.removeProperty("transform-origin");
            };
          }
        });
      }

      function setMode(mode) {
        if (mode === state.mode) return;
        const previousMode = state.mode;
        pauseActiveMode();
        state.mode = mode;
        modeButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.mode === mode)));
        transitionControls();
        applyClockScale();
        updateDisplay();
      }

      function updateDisplay() {
        if (state.mode === "clock") {
          const now = new Date();
          renderDigits(now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds(), true);
          return;
        }
        const remaining = state.mode === "timer" ? state.timerRemaining : state.pomRemaining;
        renderDigits(remaining);
      }

      const displayPlaceholder = document.createComment("clock display location");
      display.parentNode.insertBefore(displayPlaceholder, display);
      let saverFrame = 0;
      let saverLastFrame = 0;
      let saverX = 0;
      let saverY = 0;
      let saverVx = 118;
      let saverVy = 86;
      let idleTimer = 0;
      let lastActivity = 0;

      function constrainSaverPosition() {
        const bounds = display.getBoundingClientRect();
        const maxX = Math.max(0, screensaver.clientWidth - bounds.width);
        const maxY = Math.max(0, screensaver.clientHeight - bounds.height);
        saverX = Math.min(maxX, Math.max(0, saverX));
        saverY = Math.min(maxY, Math.max(0, saverY));
        display.style.setProperty("--clock-position", `translate3d(${saverX}px, ${saverY}px, 0)`);
      }

      function saverAnimationFrame(timestamp) {
        if (!state.screensaver || document.hidden) return;
        if (saverLastFrame) {
          const elapsed = Math.min((timestamp - saverLastFrame) / 1000, 0.05);
          saverX += saverVx * elapsed;
          saverY += saverVy * elapsed;
          const bounds = display.getBoundingClientRect();
          const maxX = Math.max(0, screensaver.clientWidth - bounds.width);
          const maxY = Math.max(0, screensaver.clientHeight - bounds.height);
          if (saverX <= 0 || saverX >= maxX) {
            saverX = Math.min(maxX, Math.max(0, saverX));
            saverVx *= -1;
          }
          if (saverY <= 0 || saverY >= maxY) {
            saverY = Math.min(maxY, Math.max(0, saverY));
            saverVy *= -1;
          }
          display.style.setProperty("--clock-position", `translate3d(${saverX}px, ${saverY}px, 0)`);
        }
        saverLastFrame = timestamp;
        saverFrame = requestAnimationFrame(saverAnimationFrame);
      }

      function stopSaverAnimation() {
        if (saverFrame) cancelAnimationFrame(saverFrame);
        saverFrame = 0;
        saverLastFrame = 0;
      }

      function startSaverAnimation() {
        if (state.screensaver && !document.hidden && !saverFrame) {
          saverLastFrame = 0;
          saverFrame = requestAnimationFrame(saverAnimationFrame);
        }
      }

      function enterScreensaver() {
        if (state.screensaver || themeEditor.open) return;
        const rect = display.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        state.screensaver = true;
        screensaver.classList.add("active");
        screensaver.append(display);
        display.classList.add("screensaver-clock");
        display.style.width = `${rect.width}px`;
        display.style.height = `${rect.height}px`;
        saverX = Math.max(0, Math.min(screensaver.clientWidth - rect.width, rect.left));
        saverY = Math.max(0, Math.min(screensaver.clientHeight - rect.height, rect.top));
        display.style.left = "0";
        display.style.top = "0";
        updateDisplay();
        constrainSaverPosition();
        startSaverAnimation();
      }

      function exitScreensaver() {
        if (!state.screensaver) return;
        state.screensaver = false;
        stopSaverAnimation();
        displayPlaceholder.parentNode.insertBefore(display, displayPlaceholder);
        display.classList.remove("screensaver-clock");
        display.removeAttribute("style");
        screensaver.classList.remove("active");
        updateDisplay();
      }

      function resetIdleTimer() {
        window.clearTimeout(idleTimer);
        idleTimer = 0;
        if (state.saverDelay > 0 && !document.hidden && !state.screensaver && !themeEditor.open) {
          idleTimer = window.setTimeout(enterScreensaver, state.saverDelay);
        }
      }

      function registerActivity() {
        const now = Date.now();
        if (now - lastActivity < 650 && !state.screensaver) return;
        lastActivity = now;
        if (state.screensaver) exitScreensaver();
        resetIdleTimer();
      }

      function tick() {
        const now = Date.now();
        if (state.mode === "clock") {
          const current = new Date();
          renderDigits(current.getHours() * 3600 + current.getMinutes() * 60 + current.getSeconds(), true);
          return;
        }
        if (state.mode === "timer" && state.timerDeadline !== null) {
          state.timerRemaining = Math.max(0, Math.ceil((state.timerDeadline - now) / 1000));
          if (state.timerRemaining === 0) {
            state.timerDeadline = null;
            controls();
          }
        } else if (state.mode === "pomodoro" && state.pomDeadline !== null) {
          let transitions = 0;
          while (state.pomDeadline <= now && transitions < 10000) {
            if (state.pomPhase === "Work") {
              state.workSessions++;
              state.pomPhase = state.workSessions % 4 === 0 ? "Long break" : "Short break";
            } else {
              state.pomPhase = "Work";
            }
            state.pomRemaining = currentPomDuration();
            if (state.pomRemaining <= 0) {
              state.pomDeadline = null;
              break;
            }
            state.pomDeadline += state.pomRemaining * 1000;
            transitions++;
          }
          if (transitions === 10000 && state.pomDeadline <= now) {
            state.pomDeadline = now + currentPomDuration() * 1000;
          }
          state.pomRemaining = state.pomDeadline === null ? 0 : Math.max(0, Math.ceil((state.pomDeadline - now) / 1000));
          updateCaption();
          if (transitions) controls();
        }
        updateDisplay();
      }

      let tickTimer = 0;
      function scheduleTick() {
        window.clearTimeout(tickTimer);
        if (document.hidden) return;
        const now = Date.now();
        let delay = 1000 - now % 1000;
        const deadline = state.mode === "timer" ? state.timerDeadline : state.mode === "pomodoro" ? state.pomDeadline : null;
        if (deadline !== null) {
          const untilDisplayChange = (deadline - now) % 1000;
          delay = Math.min(delay, untilDisplayChange > 0 ? untilDisplayChange : 1000);
        }
        tickTimer = window.setTimeout(() => {
          tick();
          scheduleTick();
        }, Math.max(25, delay));
      }

      function toggleTimer() {
        if (state.timerDeadline !== null) {
          pauseActiveMode();
        } else {
          if (state.timerRemaining === 0) state.timerRemaining = durationFromInputs();
          if (state.timerRemaining > 0) state.timerDeadline = Date.now() + state.timerRemaining * 1000;
        }
        controls();
        updateDisplay();
      }

      function resetTimer() {
        state.timerDeadline = null;
        state.timerRemaining = durationFromInputs();
        controls();
        updateDisplay();
      }

      function togglePomodoro() {
        if (state.pomDeadline !== null) {
          pauseActiveMode();
        } else {
          if (state.pomRemaining <= 0) state.pomRemaining = currentPomDuration();
          state.pomDeadline = Date.now() + state.pomRemaining * 1000;
        }
        controls();
        updateDisplay();
      }

      function resetPomodoro() {
        state.pomDeadline = null;
        state.pomPhase = "Work";
        state.workSessions = 0;
        state.pomRemaining = currentPomDuration();
        controls();
        updateDisplay();
      }

      function setTheme(index, direction = 1) {
        if (state.themeSwitching) return;
        state.themeSwitching = true;
        state.themeIndex = (index + themes.length) % themes.length;
        const theme = themes[state.themeIndex];
        themeSwitcher.setAttribute("aria-busy", "true");
        document.documentElement.dataset.wipeDirection = direction < 0 ? "reverse" : "forward";
        const applyTheme = () => {
          document.documentElement.dataset.theme = theme.id;
          document.documentElement.style.colorScheme = theme.scheme;
          setCustomThemeStyle(theme);
          themeColor.content = theme.color;
          updateThemeMeta();
          if (typeof document.startViewTransition === "function") {
            themeWipeEdge.style.viewTransitionName = "wipe-edge";
            themeWipeEdge.style.opacity = "1";
          }
        };
        const finishTransition = () => {
          themeSwitcher.removeAttribute("aria-busy");
          themeWipeEdge.style.viewTransitionName = "none";
          themeWipeEdge.style.opacity = "0";
          delete document.documentElement.dataset.wipeDirection;
          state.themeSwitching = false;
          persistSettings();
        };

        if (typeof document.startViewTransition === "function") {
          document.startViewTransition(applyTheme).finished.then(finishTransition, finishTransition);
        } else {
          applyTheme();
          window.setTimeout(finishTransition, 720);
        }
      }

      let editingThemeId = "";
      function openThemeEditor() {
        window.clearTimeout(settingsCloseTimer);
        refreshManagedThemes(editingThemeId);
        fillThemeEditor(themes.find(theme => theme.id === editingThemeId));
        if (!themeEditor.open) themeEditor.showModal();
        requestAnimationFrame(() => {
          themeEditor.classList.add("visible");
          settingsToggle.setAttribute("aria-expanded", "true");
        });
      }

      function closeThemeEditor() {
        if (!themeEditor.open) return;
        if (!themeEditor.classList.contains("visible")) {
          window.clearTimeout(settingsCloseTimer);
          settingsCloseTimer = window.setTimeout(() => {
            if (themeEditor.open && !themeEditor.classList.contains("visible")) themeEditor.close();
          }, 430);
          return;
        }
        themeEditor.classList.remove("visible");
        settingsToggle.setAttribute("aria-expanded", "false");
        window.clearTimeout(settingsCloseTimer);
        settingsCloseTimer = window.setTimeout(() => {
          if (themeEditor.open && !themeEditor.classList.contains("visible")) themeEditor.close();
        }, 430);
      }

      function selectSettingsTab(selected) {
        settingsTabs.forEach((tab, index) => {
          const active = tab.dataset.settingsTab === selected;
          tab.setAttribute("aria-selected", String(active));
          tab.tabIndex = active ? 0 : -1;
          if (active) settingsIndicator.style.transform = `translateX(${index * 100}%)`;
        });
        settingsPanels.forEach(panel => {
          panel.hidden = panel.dataset.settingsPanel !== selected;
        });
      }

      function editorSourceTheme() {
        return themes.find(theme => theme.id === editingThemeId) || themes[state.themeIndex];
      }

      function saveThemeFromEditor() {
        if (state.themeSwitching) {
          editorError.textContent = "Wait for the current theme transition to finish.";
          return;
        }
        try {
          const theme = readThemeEditor(editingThemeId);
          const previous = [...themes];
          const existingIndex = themes.findIndex(candidate => candidate.id === editingThemeId);
          if (existingIndex >= 0) themes[existingIndex] = toCarouselTheme(theme);
          else themes.push(toCarouselTheme(theme));
          if (!persistCustomThemes()) {
            themes.splice(0, themes.length, ...previous);
            return;
          }
          const index = themes.findIndex(candidate => candidate.id === theme.id);
          editingThemeId = theme.id;
          refreshManagedThemes(editingThemeId);
          closeThemeEditor();
          setTheme(index, 1);
        } catch (error) {
          editorError.textContent = error.message;
        }
      }

      function deleteThemeFromEditor() {
        if (!editingThemeId) {
          editorError.textContent = "Built-in themes cannot be deleted.";
          return;
        }
        const theme = themes.find(candidate => candidate.id === editingThemeId);
        if (!theme || !window.confirm(`Delete “${theme.name}”?`)) return;
        const deletedIndex = themes.indexOf(theme);
        const wasSelected = state.themeIndex === deletedIndex;
        const previous = [...themes];
        themes.splice(deletedIndex, 1);
        if (!persistCustomThemes()) {
          themes.splice(0, themes.length, ...previous);
          return;
        }
        editingThemeId = "";
        refreshManagedThemes();
        fillThemeEditor(null);
        if (wasSelected) {
          state.themeIndex = 0;
          setTheme(0, 1);
        } else {
          if (deletedIndex < state.themeIndex) state.themeIndex--;
          if (state.themeIndex >= themes.length) state.themeIndex = themes.length - 1;
          updateThemeMeta();
          persistSettings();
        }
        announce("Custom theme deleted.");
      }

      function enterFullscreen() {
        if (state.fullscreen) return;
        state.fullscreen = true;
        document.documentElement.classList.add("fullscreen-mode");
        requestAnimationFrame(applyClockScale);
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {
            announce("Browser fullscreen is unavailable; jiKAN's fullscreen layout remains active.");
          });
        }
      }

      function exitFullscreen() {
        state.fullscreen = false;
        document.documentElement.classList.remove("fullscreen-mode");
        requestAnimationFrame(applyClockScale);
        if (document.fullscreenElement) document.exitFullscreen().catch(() => announce("The browser could not exit fullscreen."));
      }

      modeButtons.forEach((button, index) => button.addEventListener("click", () => {
        modeIndicator.style.transform = `translateX(${index * 100}%)`;
        setMode(button.dataset.mode);
        scheduleTick();
      }));
      themeSwitcher.addEventListener("click", event => {
        const button = event.target.closest("[data-theme-step]");
        if (!button) return;
        const direction = Number(button.dataset.themeStep);
        setTheme(state.themeIndex + direction, direction);
      });
      panel.addEventListener("click", event => {
        const stepButton = event.target.closest("[data-duration-step]");
        if (stepButton) {
          const input = stepButton.closest(".duration-input-wrap")?.querySelector("[data-duration]");
          if (!input || input.disabled) return;
          const min = Number(input.min) || 0;
          const max = Number(input.max);
          const next = Math.min(max, Math.max(min, safeInt(input, min) + Number(stepButton.dataset.durationStep)));
          input.value = String(next);
          input.dispatchEvent(new Event("change", { bubbles: true }));
          return;
        }
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "fullscreen") enterFullscreen();
        if (action === "screensaver") enterScreensaver();
        if (action === "toggle") state.mode === "timer" ? toggleTimer() : togglePomodoro();
        if (action === "reset") state.mode === "timer" ? resetTimer() : resetPomodoro();
        scheduleTick();
      });
      document.querySelector(".topbar-actions").addEventListener("click", event => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "theme-editor") {
          if (themeEditor.open) closeThemeEditor();
          else openThemeEditor();
        }
      });
      settingsTabs.forEach(tab => tab.addEventListener("click", () => selectSettingsTab(tab.dataset.settingsTab)));
      selectSettingsTab("themes");
      themeEditor.addEventListener("click", event => {
        if (event.target === themeEditor) closeThemeEditor();
      });
      themeEditor.addEventListener("cancel", event => {
        event.preventDefault();
        closeThemeEditor();
      });
      themeEditor.addEventListener("click", event => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "close-editor") closeThemeEditor();
        if (action === "new-theme") {
          editingThemeId = "";
          managedTheme.value = "";
          syncCustomSelect(managedTheme);
          fillThemeEditor(null, "My Theme");
          editorName.focus();
        }
        if (action === "duplicate-theme") {
          const source = editorSourceTheme();
          editingThemeId = "";
          managedTheme.value = "";
          syncCustomSelect(managedTheme);
          fillThemeEditor(source.custom ? source : { ...currentPalette(), glow: 0 }, `${source.name} Copy`);
          editorName.value = `${source.name} Copy`.slice(0, 32);
          editorName.focus();
        }
        if (action === "delete-theme") deleteThemeFromEditor();
        if (action === "save-theme") saveThemeFromEditor();
      });
      managedTheme.addEventListener("change", () => {
        editingThemeId = managedTheme.value;
        fillThemeEditor(themes.find(theme => theme.id === editingThemeId));
      });
      themeEditor.addEventListener("close", () => {
        themeEditor.classList.remove("visible");
        settingsToggle.setAttribute("aria-expanded", "false");
        resetIdleTimer();
      });
      clockScaleControl.value = String(state.clockScale);
      document.querySelectorAll('input[type="range"]').forEach(input => {
        updateRangeTrack(input);
        input.addEventListener("input", () => updateRangeTrack(input));
      });
      clockScaleControl.addEventListener("input", () => {
        state.clockScale = Number(clockScaleControl.value);
        applyClockScale();
      });
      clockScaleControl.addEventListener("change", persistSettings);
      screensaverDelay.value = String(state.saverDelay);
      enhanceCustomSelect(managedTheme);
      enhanceCustomSelect(screensaverDelay);
      hourFormatButtons.forEach((button, index) => {
        const format = button.dataset.hourFormat;
        const active = format === state.hourFormat;
        button.setAttribute("aria-pressed", String(active));
        if (active) formatIndicator.style.transform = `translateX(${index * 100}%)`;
        button.addEventListener("click", () => {
          state.hourFormat = format === "12" ? "12" : "24";
          hourFormatButtons.forEach(option => option.setAttribute("aria-pressed", String(option === button)));
          formatIndicator.style.transform = `translateX(${index * 100}%)`;
          persistSettings();
          updateDisplay();
        });
      });
      screensaverDelay.addEventListener("change", () => {
        state.saverDelay = Number(screensaverDelay.value);
        persistSettings();
        resetIdleTimer();
      });
      panel.addEventListener("change", event => {
        const input = event.target.closest("[data-duration]");
        if (!input) return;
        const max = Number(input.max);
        const min = Number(input.min) || 0;
        input.value = String(Math.min(max, Math.max(min, safeInt(input, min))));
        syncDurationStepper(input);
        if (state.mode === "timer") {
          state.timerConfig[input.dataset.duration] = safeInt(input, min);
          state.timerRemaining = durationFromInputs();
        } else {
          state.pomConfig[input.dataset.duration] = safeInt(input, min);
          state.pomRemaining = currentPomDuration();
        }
        persistSettings();
        updateDisplay();
        scheduleTick();
      });
      document.addEventListener("keydown", event => {
        if (state.screensaver && event.key === "Escape") {
          event.preventDefault();
          exitScreensaver();
          resetIdleTimer();
          return;
        }
        if (event.key === "Escape" && themeEditor.open) {
          event.preventDefault();
          closeThemeEditor();
          return;
        }
        registerActivity();
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.code === "Space" && !event.target.matches("input, textarea, select, [contenteditable='true']")) {
          event.preventDefault();
          if (event.repeat || state.mode === "clock" || themeEditor.open) return;
          state.mode === "timer" ? toggleTimer() : togglePomodoro();
          scheduleTick();
          return;
        }
        if (event.key.toLowerCase() === "f" && !event.target.matches("input, textarea, select")) {
          event.preventDefault();
          state.fullscreen ? exitFullscreen() : enterFullscreen();
        } else if (event.key === "Escape" && state.fullscreen) {
          exitFullscreen();
        }
      });
      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) {
          state.fullscreen = false;
          document.documentElement.classList.remove("fullscreen-mode");
        }
      });
      document.addEventListener("pointerdown", event => {
        if (!event.target.closest(".custom-select-wrap")) {
          customSelects.forEach(custom => closeCustomSelect(custom.wrap));
        }
        registerActivity();
      }, { passive: true });
      document.addEventListener("pointermove", event => {
        const button = event.target.closest("button");
        const spotlightTarget = button || event.target.closest(".brand");
        if (spotlightTarget) {
          const bounds = spotlightTarget.getBoundingClientRect();
          spotlightTarget.style.setProperty("--spot-x", `${((event.clientX - bounds.left) / bounds.width) * 100}%`);
          spotlightTarget.style.setProperty("--spot-y", `${((event.clientY - bounds.top) / bounds.height) * 100}%`);
        }
        if (state.screensaver || Math.abs(event.movementX) + Math.abs(event.movementY) > 2) registerActivity();
      }, { passive: true });
      window.addEventListener("resize", () => {
        applyClockScale();
        if (state.screensaver) constrainSaverPosition();
      }, { passive: true });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          window.clearTimeout(idleTimer);
          idleTimer = 0;
          window.clearTimeout(tickTimer);
          stopSaverAnimation();
          return;
        }
        tick();
        scheduleTick();
        startSaverAnimation();
        resetIdleTimer();
      });

      const initialTheme = themes[state.themeIndex];
      document.documentElement.dataset.theme = initialTheme.id;
      document.documentElement.style.colorScheme = initialTheme.scheme;
      setCustomThemeStyle(initialTheme);
      themeColor.content = initialTheme.color;
      applyClockScale();
      updateThemeMeta();
      refreshManagedThemes();
      syncCustomSelect(managedTheme);
      controls();
      tick();
      scheduleTick();
      resetIdleTimer();
    })();
  </script>
</body>
</html>
